<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Air_ Almanaque do Ar</title>
<meta name="description" content="Almanaque do ar: fenômenos do estado gasoso, o ar no edifício e obras de referência em arte e arquitetura.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: specimen-sheet gallery in two volumes plus a personal board — plates share hairline borders like a printed plate index; saved plates invert their header strip; Vol. II plates point back to their source phenomenon in Vol. I */
:root{
  --paper:#f4f4f2;
  --ink:#111111;
  --mute:#5f5f5d;
  --line:#c9c9c6;
  --hover:#ebebe8;
  --shade:rgba(10,10,10,.55);
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#0d0d0d;--ink:#ececea;--mute:#9a9a97;--line:#2e2e2d;--hover:#161616;--shade:rgba(0,0,0,.72);color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#0d0d0d;--ink:#ececea;--mute:#9a9a97;--line:#2e2e2d;--hover:#161616;--shade:rgba(0,0,0,.72);color-scheme:dark}

body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1320px;margin:0 auto}
button{font:inherit;color:inherit}

/* masthead */
.mast{padding-block:36px 28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:24px 48px;align-items:end}
.eyebrow{grid-column:1/-1;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.lang{display:flex;border:1px solid var(--ink)}
.lang button{all:unset;cursor:pointer;padding:7px 10px;font:500 11px/1 var(--mono);letter-spacing:.12em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1{margin:0;font:400 clamp(96px,22vw,250px)/.82 var(--display);letter-spacing:-.04em}
.cur{display:inline-block;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lede{margin:0 0 6px;max-width:42ch}
.lede strong{font:italic 400 22px/1.25 var(--display);display:block;margin-bottom:12px;text-wrap:balance}
.lede span{color:var(--mute)}

/* views: two volumes + board */
.vols{display:grid;grid-template-columns:1fr 1fr 1fr .8fr;border:1px solid var(--ink)}
.vols button{all:unset;box-sizing:border-box;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline;min-width:0}
.vols button + button{border-left:1px solid var(--ink)}
.vols .num{font:400 44px/1 var(--display);grid-row:span 2}
.vols .nm{font:italic 400 19px/1.2 var(--display)}
.vols .ct{font:400 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.vols button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.vols button[aria-pressed="true"] .ct{color:var(--paper)}
.vols button:hover:not([aria-pressed="true"]){background:var(--hover)}
.vols button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.vols .pin{width:30px;height:44px;grid-row:span 2;align-self:center}

/* filters */
.filters{display:flex;flex-wrap:wrap;padding-block:18px;font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.filters button{letter-spacing:inherit;text-transform:inherit;font:inherit;background:none;border:1px solid var(--ink);margin:0 -1px -1px 0;padding:10px 14px;cursor:pointer;display:flex;gap:8px}
.filters button sup{font-size:10px;color:var(--mute);vertical-align:0}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.filters button[aria-pressed="true"] sup{color:var(--paper)}
.filters button:hover:not([aria-pressed="true"]){background:var(--hover)}
.filters button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;position:relative;z-index:1}

/* plates */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.plate{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);display:flex;flex-direction:column;min-width:0;transition:background .2s;scroll-margin-top:24px}
.plate:hover,.plate:focus-within{background:var(--hover)}
.plate:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
.plate.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{background:var(--ink);color:var(--paper)}100%{background:transparent}}
.plate-head{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.plate-head span:last-child{color:var(--mute)}
.plate.saved .plate-head{background:var(--ink);color:var(--paper);border-bottom-color:var(--ink)}
.plate.saved .plate-head span:last-child{color:var(--paper)}
figure{margin:0;padding:18px 20px 8px}
figure svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible}
.open-fig{all:unset;display:block;cursor:zoom-in}
.open-fig:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.plate-body{padding:6px 18px 0;display:flex;flex-direction:column;gap:10px;flex:1}
h2{margin:0;font:400 28px/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.trait{margin:0;font:italic 400 17px/1.3 var(--display)}
.trait b,.sec b{display:block;font:500 10px/1 var(--mono);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.desc{margin:0;font-size:14px;line-height:1.55;max-width:60ch}
.origin{align-self:flex-start;font:400 11px/1.3 var(--mono);background:none;border:1px solid var(--ink);padding:6px 9px;cursor:pointer;text-align:left}
.origin:hover{background:var(--ink);color:var(--paper)}
.origin:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.acts{display:flex;margin:16px 18px 0}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:1px solid var(--ink);padding:9px 10px;cursor:pointer;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.acts button + button{border-left:0}
.acts button:hover{background:var(--ink);color:var(--paper)}
.acts button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.acts button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bm{width:10px;height:13px;flex:none}
.bm path{fill:none;stroke:currentColor;stroke-width:1.4}
[aria-pressed="true"] .bm path{fill:currentColor}
.datum{margin:12px 18px 0;padding-block:10px 14px;border-top:1px dashed var(--line);font:400 11.5px/1.4 var(--mono);display:flex;gap:10px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.datum::before{content:attr(data-label);color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:10px;padding-top:1px;flex:none}

/* drawing rules: every illustration is line work in the ink token */
.art svg{color:var(--ink)}
.plate.flash .art svg{color:inherit}
.art svg :is(path,line,circle,ellipse,rect,polyline){fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.art svg .f{fill:currentColor;stroke:none}
.art svg .h{fill:url(#hatch)}
.art svg .thin{stroke-width:.7}
.art svg .bold{stroke-width:2.4}
.art svg .dash{stroke-dasharray:3 3}
.art svg .flow{stroke-dasharray:6 4}
.art svg .knock{fill:var(--paper);stroke:currentColor}
.art svg text{fill:currentColor;stroke:none;font:400 8.6px var(--mono);letter-spacing:.02em}
.art svg text.big{font:400 24px var(--display)}
.plate:hover .flow,.plate:focus-within .flow,dialog .flow{animation:drift 1.2s linear infinite}
.plate:hover .bub,.plate:focus-within .bub,dialog .bub{animation:rise 2.4s ease-in infinite}
@keyframes drift{to{stroke-dashoffset:-20}}
@keyframes rise{from{transform:translateY(6px);opacity:.2}to{transform:translateY(-6px);opacity:1}}

/* photos — always shown in black and white to keep the almanac’s palette */
.filters{align-items:stretch}
.cover-tg{margin-left:auto;display:flex;align-items:center;gap:0}
.cover-tg + .cover-tg{margin-left:16px}
.cover-tg > span{color:var(--mute);padding-right:12px;font-size:11px;letter-spacing:.12em}
.cover-tg button{margin:0 -1px -1px 0}
@media (max-width:620px){.cover-tg{margin-left:0;margin-top:10px;width:100%}}
figure.has-photo{padding:0;border-bottom:1px solid var(--line)}
.ph-cover{display:block;width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;filter:grayscale(1) contrast(1.06);background:var(--hover)}
.seg{display:flex;flex-wrap:wrap}
.seg button{background:none;border:1px solid var(--ink);margin:0 -1px -1px 0;padding:8px 12px;cursor:pointer;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:hover:not([aria-pressed="true"]){background:var(--hover)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;position:relative}
.pmain img{display:block;width:100%;max-height:58vh;object-fit:contain;filter:grayscale(1) contrast(1.04);background:var(--hover)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.pthumb{all:unset;cursor:pointer;display:block;border:1px solid var(--line)}
.pthumb[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.pthumb:focus-visible{outline:2px solid var(--ink)}
.pthumb img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1)}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ptools button,.upl{background:none;border:1px solid var(--ink);padding:8px 12px;cursor:pointer;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;align-self:flex-start}
.ptools button:hover,.upl:hover{background:var(--ink);color:var(--paper)}
.upl{display:inline-block;background:var(--ink);color:var(--paper)}
.upl:hover{background:none;color:var(--ink)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.vh:focus-visible + .upl{outline:2px solid var(--ink);outline-offset:2px}
.ptag{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.pempty{margin:0;border:1px dashed var(--line);padding:28px 18px;text-align:center;color:var(--mute);font-size:14px}
.credit{margin:0;font:400 11px/1.45 var(--mono);color:var(--mute)}
.credit a{color:var(--ink);text-underline-offset:3px}
.pmsg{margin:0;font:400 12px/1.4 var(--mono)}
.weblink{font:400 12px/1.4 var(--mono);color:var(--ink);align-self:flex-start;text-underline-offset:3px}

/* detail sheet */
dialog{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:0;width:min(1060px,calc(100vw - 32px));max-width:none;max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:var(--shade)}
.dlg-bar{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--ink);font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.dlg-bar .nav{display:flex}
.dlg-bar .nav button{background:none;border:1px solid var(--ink);padding:8px 11px;cursor:pointer;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-left:-1px}
.dlg-bar .nav button:hover{background:var(--ink);color:var(--paper)}
.dlg-bar .nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;position:relative}
.dlg-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.dlg-fig{padding:28px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.dlg-fig .datum{margin:0}
.dlg-text{padding:28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.dlg-text h2{font-size:clamp(32px,4vw,46px)}
.sec{margin:0}
.sec p{margin:0;max-width:60ch}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.dlg-text .acts{margin:4px 0 0}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:22px;padding-block:24px 8px}
.tile{border:1px solid var(--ink);display:flex;flex-direction:column;position:relative;min-width:0;background:var(--paper)}
.tile::before{content:"";position:absolute;top:-6px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--ink)}
.tile .plate-head{border-bottom:1px solid var(--ink)}
.tile figure{padding:12px 16px 4px}
.tile h3{margin:0;padding:0 16px;font:400 22px/1.1 var(--display);text-wrap:balance}
.tile .trait{padding:6px 16px 0;font-size:15px}
.tile label{display:block;padding:12px 16px 0;font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tile textarea{display:block;width:calc(100% - 32px);margin:6px 16px 0;box-sizing:border-box;min-height:84px;resize:vertical;border:1px solid var(--line);background:transparent;color:var(--ink);font:400 13.5px/1.45 var(--body);padding:8px 10px}
.tile textarea:focus{outline:none;border-color:var(--ink)}
.tile .acts{margin:12px 16px 16px}
.tile .acts button{padding:8px 6px}
.empty{grid-column:1/-1;border:1px dashed var(--ink);padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{margin:0;max-width:44ch}
.empty strong{font:italic 400 26px/1.2 var(--display)}
.store-note{font:400 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--mute);padding-block:4px 0}

footer{padding-block:28px 48px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:400 11px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

@media (max-width:860px){
  .vols{grid-template-columns:1fr 1fr}
  .vols button:nth-child(odd){border-left:0}
  .vols button:nth-child(n+3){border-top:1px solid var(--ink)}
  .dlg-body{grid-template-columns:1fr}
  .dlg-fig{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:620px){
  .mast{grid-template-columns:1fr;padding-block:24px 20px}
  h2{font-size:25px}
  .vols{grid-template-columns:1fr}
  .vols button + button{border-left:0;border-top:1px solid var(--ink)}
  .dlg-fig,.dlg-text{padding:18px}
}
@media (prefers-reduced-motion: reduce){.cur,.flow,.bub,.plate.flash{animation:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" style="fill:var(--ink);stroke:none"></path>
    </marker>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" style="stroke:var(--ink);stroke-width:.8"></line>
    </pattern>
  </defs>
</svg>

<div class="wrap">
  <header class="mast">
    <div class="eyebrow"><span id="eb-left">Almanaque do ar</span><span class="lang" role="group" aria-label="Idioma / Language"><button type="button" id="lang-pt" data-lang="pt">PT</button><button type="button" id="lang-en" data-lang="en">EN</button></span></div>
    <h1>Air<span class="cur" aria-hidden="true">_</span></h1>
    <p class="lede"><strong id="lede-t"></strong><span id="lede-s"></span></p>
  </header>

  <div class="vols" id="vols" role="group"></div>

  <nav class="filters" id="filters"></nav>

  <main id="main"></main>

  <footer>
    <span id="foot-l"></span>
    <span id="foot-r"></span>
  </footer>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<script>
(function(){
  /* ───────── language ───────── */
  let L = 'pt';
  try { const s = localStorage.getItem('air-lang'); if (s === 'en' || s === 'pt') L = s; } catch (e) {}
  const pick = s => { const p = String(s).split('|'); return L === 'en' && p[1] !== undefined ? p[1] : p[0]; };

  const UI = {
    pt: {
      almanac: 'Almanaque do ar', vol: 'Volume', plates: 'pranchas', plate: 'Prancha', all: 'Todos',
      trait: 'Característica', data: 'Dado', ref: 'Ref.', origin: 'Origem →', more: 'Ler mais', save: 'Salvar', saved: 'Salvo',
      how: 'Como funciona', arch: 'Leitura arquitetônica', design: 'Como projetar', applied: 'Aplicado em', fromv: 'Deriva de',
      close: 'Fechar', prev: '← Anterior', next: 'Próxima →', board: 'Meu mural', boardCt: n => `${n} ${n === 1 ? 'prancha salva' : 'pranchas salvas'}`,

      emptyT: 'Seu mural está vazio.', emptyS: 'Use “Salvar” em qualquer prancha para fixá-la aqui. As pranchas salvas ganham a faixa preta no topo.', browse: 'Ver o Volume I',
      remote: 'Guardado na sua conta', local: 'Guardado só neste navegador', filterBy: 'Filtrar por domínio', views: 'Volumes e mural',
      v1: ['O estado gasoso', 'O ar como matéria e mecanismo.', 'Antes de tratar o ar como elemento arquitetônico, este volume cataloga como ele age na atmosfera, nas reações químicas, nos corpos e nas plantas. Cada prancha isola um fenômeno do estado gasoso.', 'Próximo: Volume II, o ar no edifício'],
      v2: ['O ar no edifício', 'O ar como material de projeto.', 'O segundo volume leva os mecanismos do primeiro para dentro da arquitetura: torres, vazios, filtros, cavidades e estruturas em que o ar é o principal material. Cada prancha indica de qual fenômeno deriva.', 'Cada prancha remete ao fenômeno de origem no Volume I'],

    },
    en: {
      almanac: 'Almanac of air', vol: 'Volume', plates: 'plates', plate: 'Plate', all: 'All',
      trait: 'Characteristic', data: 'Data', ref: 'Ref.', origin: 'Origin →', more: 'Read more', save: 'Save', saved: 'Saved',

      remote: 'Stored in your account', local: 'Stored in this browser only', filterBy: 'Filter by domain', views: 'Volumes and board',
      v1: ['The gaseous state', 'Air as matter and mechanism.', 'Before treating air as an architectural element, this volume catalogues how it behaves in the atmosphere, in chemical reactions, in bodies and in plants. Each plate isolates one phenomenon of the gaseous state.', 'Next: Volume II, air in the building'],
      v2: ['Air in the building', 'Air as a design material.', 'The second volume carries the mechanisms of the first into architecture: towers, voids, filters, cavities and structures in which air is the main material. Each plate shows which phenomenon it derives from.', 'Each plate points back to its source phenomenon in Volume I'],
      vm: ['My board', 'Your reference board.', 'The plates you save collect here with your notes. Reorder, annotate and use it as a research board for the project.', 'Air_ · personal board']
    }
  };
  const u = k => UI[L][k];

  const DOM = {
    nat: 'Natureza|Nature', fis: 'Física|Physics', qui: 'Química|Chemistry', bio: 'Biologia|Biology', mic: 'Microbiologia|Microbiology', fau: 'Fauna|Fauna', flo: 'Flora|Flora', tec: 'Técnica|Technique',
    ven: 'Ventilação|Ventilation', env: 'Envelope|Envelope', res: 'Resfriamento|Cooling', est: 'Estrutura|Structure', atm: 'Atmosfera|Atmosphere'
  };
  const ORDER = { 1: ['nat', 'fis', 'qui', 'bio', 'mic', 'fau', 'flo', 'tec'], 2: ['ven', 'env', 'res', 'est', 'atm'] };

  /* ───────── drawing helpers ───────── */
  const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const f1 = n => n.toFixed(1);

  const hex = (x, y, r) => `<path d="${[0,1,2,3,4,5].map(k => `${k ? 'L' : 'M'}${f1(x + r * Math.cos(k * Math.PI / 3))} ${f1(y + r * Math.sin(k * Math.PI / 3))}`).join(' ')} Z"/>`;
  const o2 = (x, y) => `<circle cx="${x - 3.5}" cy="${y}" r="3"/><circle cx="${x + 3.5}" cy="${y}" r="3"/>`;

  const art = {
    /* ───────── Volume I ───────── */
    conveccao: () =>

    ["Convecção", "Transporte de calor pelo próprio movimento do ar", "O ar aquecido se expande, fica menos denso e sobe; o ar frio ocupa seu lugar e desce. O ciclo forma células que redistribuem calor, da escala de uma sala à da atmosfera.", "A convecção natural depende só de diferenças de densidade; a forçada usa ventiladores ou vento. Em grande escala, ela organiza as células de circulação global e as térmicas que aves e planadores usam para subir.", "Explica a estratificação: o ar quente se acumula sob o teto. Pés-direitos altos, aberturas zenitais e entradas baixas com saídas altas tiram proveito dela.", "A densidade do ar cai ≈ 0,34% a cada +1 °C"],
    ["Convection", "Heat carried by the movement of air itself", "Heated air expands, becomes less dense and rises; cooler air takes its place and sinks. The cycle forms cells that redistribute heat, from the scale of a room to that of the atmosphere.", "Natural convection relies only on density differences; forced convection uses fans or wind. At large scales it organises global circulation cells and the thermals that birds and gliders ride upward.", "It explains stratification: warm air pools under the ceiling. Tall ceilings, roof openings and low inlets with high outlets put it to work.", "Air density falls ≈ 0.34% per +1 °C"]);

    ["Dew point", "The threshold where vapour becomes water", "The warmer the air, the more vapour it carries. Cooled to its dew point it saturates, and the excess condenses as droplets on cold surfaces, as clouds or as fog.", "Relative humidity is how much vapour air holds compared with its maximum at that temperature. That is why the same air becomes “damper” as it cools, without gaining water.", "Condensation inside walls and roofs breeds mould and damages materials. Vapour control, ventilation and avoiding thermal bridges keep surfaces above the dew point.", "Vapour capacity nearly doubles every +10 °C"]);
  P(1, 'nat', 'inversao',
    ["Inversão térmica", "Uma camada quente que tampa o ar de baixo", "Normalmente o ar esfria com a altura e sobe livre. Quando uma camada mais quente se forma acima de uma mais fria, a convecção trava e fumaça e poluentes ficam presos junto ao solo.", "Inversões são comuns em noites claras e sem vento e em vales cercados por montanhas. Desfazem-se quando o sol aquece o solo ou uma frente traz vento.", "Cidades em vales sofrem com smog nesses dias. O desenho urbano pode abrir corredores de vento e afastar fontes de emissão das partes baixas.", "Gradiente padrão: −6,5 °C por km de altitude"],
    ["Temperature inversion", "A warm layer that lids the air below", "Normally air cools with height and rises freely. When a warmer layer forms above a cooler one, convection stalls and smoke and pollutants are trapped near the ground.", "Inversions are common on clear, calm nights and in valleys ringed by mountains. They break up when the sun warms the ground or a front brings wind.", "Valley cities suffer smog on such days. Urban design can open wind corridors and keep emission sources out of low-lying areas.", "Standard lapse rate: −6.5 °C per km"]);
  P(1, 'nat', 'vortice',
    ["Vórtice", "Ar que gira em torno de um eixo", "Redemoinhos, tornados e furacões são massas de ar em rotação. Quanto mais o ar se aproxima do centro, mais rápido gira, como uma patinadora que fecha os braços.", "Num furacão, o ar quente e úmido do oceano sobe em espiral e libera calor ao condensar, alimentando o sistema. No centro, o olho é uma coluna de ar calmo que desce.", "Edifícios altos soltam vórtices nas quinas que fazem a estrutura oscilar. Formas torcidas ou recortadas, como a da Shanghai Tower, desorganizam esses vórtices e reduzem as cargas de vento.", "Furacão: ventos sustentados ≥ 119 km/h"],
    ["Vortex", "Air spinning around an axis", "Whirlwinds, tornadoes and hurricanes are rotating masses of air. The closer air gets to the centre, the faster it spins, like a skater pulling in her arms.", "In a hurricane, warm moist ocean air spirals upward and releases heat as it condenses, feeding the system. At the centre, the eye is a column of calm, sinking air.", "Tall buildings shed vortices at their corners that make the structure sway. Twisted or notched forms, like the Shanghai Tower, break these vortices up and reduce wind loads.", "Hurricane: sustained winds ≥ 119 km/h"]);

  P(1, 'fis', 'chamine',
    ["Efeito chaminé", "Ventilação movida por temperatura e altura", "O ar interno, mais quente e leve, sai pelas aberturas altas e puxa ar externo pelas baixas. Quanto maior a altura entre aberturas e a diferença de temperatura, maior o fluxo, sem energia mecânica.", "O efeito é mais forte no inverno, quando a diferença entre dentro e fora é maior. Em arranha-céus ele cria correntes fortes em escadas e poços de elevador.", "Base de torres de exaustão, átrios e chaminés solares. A altura entre entrada e saída de ar é o principal parâmetro de projeto.", "Q ∝ A·√(g·h·ΔT / T)"],
    ["Stack effect", "Ventilation driven by temperature and height", "Warmer, lighter indoor air leaves through high openings and draws outside air in through low ones. The greater the height between openings and the temperature difference, the stronger the flow, with no mechanical energy.", "The effect is strongest in winter, when the indoor–outdoor difference is largest. In skyscrapers it drives strong drafts through stairs and lift shafts.", "The basis of exhaust stacks, atria and solar chimneys. The height between air inlet and outlet is the main design parameter.", "Q ∝ A·√(g·h·ΔT / T)"]);
  P(1, 'fis', 'venturi',
    ["Efeito Venturi", "Estreitar acelera o ar e reduz sua pressão", "Ao passar por uma constrição, a velocidade do ar aumenta e a pressão estática cai, conservando a energia do escoamento (Bernoulli). Base de carburadores, medidores de vazão e ventilação por sucção.", "Daniel Bernoulli descreveu a relação em 1738; Giovanni Venturi a demonstrou em tubos no fim do século XVIII. O mesmo princípio explica por que uma porta bate quando o vento passa rápido pela fresta.", "Passagens estreitas entre edifícios aceleram o vento ao nível da rua. Bem usado, o estreitamento puxa ar de dentro dos ambientes; mal resolvido, cria esquinas desconfortáveis.", "p + ½ρv² = constante"],
    ["Venturi effect", "Narrowing speeds air up and lowers its pressure", "Passing through a constriction, air speeds up and its static pressure drops, conserving the flow’s energy (Bernoulli). The basis of carburettors, flow meters and suction ventilation.", "Daniel Bernoulli described the relation in 1738; Giovanni Venturi demonstrated it in pipes in the late 18th century. The same principle explains why a door slams when wind rushes through the gap.", "Narrow passages between buildings speed up wind at street level. Used well, the constriction draws air out of rooms; handled badly, it makes windy, uncomfortable corners.", "p + ½ρv² = constant"]);
  P(1, 'fis', 'coanda',
    ["Efeito Coanda", "Jatos de ar que seguem superfícies curvas", "Um jato de ar tende a aderir a uma superfície próxima e acompanhar sua curvatura, em vez de seguir reto. O fenômeno leva o nome de Henri Coandă, que o estudou nos anos 1930.", "O jato arrasta o ar ao redor; junto à parede falta ar para ser arrastado, a pressão cai e o jato é puxado contra a superfície.", "Explica por que o ar insuflado corre colado ao teto antes de descer. Difusores são posicionados para usar o efeito e espalhar o ar sem correntes incômodas.", "Difusores de teto usam o efeito para lançar o ar mais longe"],
    ["Coandă effect", "Air jets that cling to curved surfaces", "A jet of air tends to attach to a nearby surface and follow its curve instead of travelling straight. The effect is named after Henri Coandă, who studied it in the 1930s.", "The jet entrains surrounding air; next to the wall there is no air left to entrain, pressure drops and the jet is pulled against the surface.", "It explains why supply air hugs the ceiling before it falls. Diffusers are placed to use the effect and spread air without uncomfortable drafts.", "Ceiling diffusers use it to throw air further"]);
  P(1, 'fis', 'empuxo',
    ["Empuxo", "O ar mais leve sobe dentro do ar mais pesado", "Pelo princípio de Arquimedes, um corpo imerso no ar recebe uma força para cima igual ao peso do ar que desloca. Um balão de ar quente sobe porque o ar dentro dele é menos denso que o de fora.", "Aquecer o ar de 20 °C para 100 °C reduz sua densidade em cerca de um quinto. Cada metro cúbico de ar quente sustenta assim cerca de 250 gramas.", "É o motor de toda ventilação natural por temperatura: plumas de ar quente sobre pessoas e equipamentos, efeito chaminé e estratificação.", "Ar a 100 °C: ~21% menos denso que a 20 °C"],
    ["Buoyancy", "Lighter air rises through heavier air", "By Archimedes’ principle, a body immersed in air is pushed up with a force equal to the weight of the air it displaces. A hot-air balloon rises because the air inside is less dense than the air outside.", "Heating air from 20 °C to 100 °C cuts its density by about a fifth. Each cubic metre of hot air can therefore lift about 250 grams.", "It powers all temperature-driven natural ventilation: warm plumes above people and equipment, the stack effect and stratification.", "Air at 100 °C: ~21% less dense than at 20 °C"]);
  P(1, 'fis', 'som',
    ["Som", "Ondas de pressão que viajam pelo ar", "O som não move o ar de um lugar a outro: as moléculas oscilam e passam o empurrão adiante, formando zonas alternadas de compressão e rarefação. Sem ar, como no vácuo, não há som.", "O som viaja mais rápido no ar quente e se curva quando a temperatura varia com a altura. Em noites de inversão, sons distantes chegam mais nítidos.", "A acústica de uma sala é o comportamento do ar dentro dela: volume, forma e materiais definem reverberação e clareza. Aberturas para ventilar também deixam o ruído entrar.", "≈ 343 m/s a 20 °C"],
    ["Sound", "Pressure waves travelling through air", "Sound does not carry air from place to place: molecules oscillate and pass the push along, forming alternating zones of compression and rarefaction. Without air, as in a vacuum, there is no sound.", "Sound travels faster in warm air and bends when temperature changes with height. On inversion nights, distant sounds arrive more clearly.", "A room’s acoustics is the behaviour of the air inside it: volume, shape and materials set reverberation and clarity. Openings that ventilate also let noise in.", "≈ 343 m/s at 20 °C"]);
  P(1, 'fis', 'miragem',
    ["Miragem", "Luz que curva ao atravessar ar de densidades diferentes", "O ar quente junto a um asfalto é menos denso e desvia a luz. Os raios vindos do céu se curvam para cima e chegam ao olho como se refletidos no chão, parecendo água.", "Há miragens inferiores, como a “água” na estrada quente, e superiores, quando ar frio fica sob ar quente e objetos distantes parecem flutuar acima do horizonte.", "O mesmo gradiente aparece sobre telhados e pavimentos superaquecidos. É um sinal visível da camada de ar quente que sombra e vegetação ajudam a evitar.", "Índice de refração do ar ≈ 1,000293"],
    ["Mirage", "Light bending through air of different densities", "Hot air above asphalt is less dense and bends light. Rays from the sky curve upward and reach the eye as if reflected off the ground, looking like water.", "There are inferior mirages, like the “water” on a hot road, and superior ones, when cold air lies under warm air and distant objects seem to float above the horizon.", "The same gradient forms over overheated roofs and paving. It is a visible sign of the hot air layer that shade and planting help prevent.", "Refractive index of air ≈ 1.000293"]);
  P(1, 'fis', 'evaporativo',
    ["Resfriamento evaporativo", "Água que evapora leva calor consigo", "Para passar a vapor, a água retira energia do entorno. A moringa de barro poroso, o suor e as fontes de pátio resfriam o ar dessa forma, sobretudo em climas secos.", "Quanto mais seco o ar, mais água evapora e maior o resfriamento. Em climas úmidos o efeito diminui, porque o ar já está perto da saturação.", "Espelhos d’água, fontes, vegetação e superfícies porosas molhadas resfriam pátios e fachadas. Funciona melhor associado à ventilação e à sombra.", "Calor latente da água ≈ 2,45 MJ/kg"],
    ["Evaporative cooling", "Evaporating water carries heat away", "To turn into vapour, water draws energy from its surroundings. Porous clay jars, sweat and courtyard fountains cool the air this way, especially in dry climates.", "The drier the air, the more water evaporates and the greater the cooling. In humid climates the effect fades, because the air is already near saturation.", "Pools, fountains, planting and wet porous surfaces cool courtyards and façades. It works best together with ventilation and shade.", "Latent heat of water ≈ 2.45 MJ/kg"]);
  P(1, 'fis', 'isolamento',
    ["Ar parado", "Isolante quando não pode circular", "O ar conduz mal o calor; o que o torna ineficiente é o movimento. Preso em câmaras pequenas, como em penas, pelos, lã ou paredes duplas, ele vira uma das melhores barreiras térmicas.", "Lã, espumas e penas isolam porque dividem o ar em bolsões pequenos demais para haver convecção. Se o ar circula, passa a transportar calor em vez de bloqueá-lo.", "Paredes duplas, vidros duplos e almofadas infladas usam esse princípio. A câmara ideal é estreita, da ordem de centímetros.", "λ ≈ 0,026 W/(m·K) a 20 °C"],
    ["Still air", "Insulating when it cannot move", "Air conducts heat poorly; what makes it inefficient is movement. Trapped in small cells, as in feathers, fur, wool or cavity walls, it becomes one of the best thermal barriers.", "Wool, foams and feathers insulate because they split air into pockets too small for convection. If the air circulates, it carries heat instead of blocking it.", "Cavity walls, double glazing and inflated cushions use this principle. The ideal cavity is narrow, on the order of centimetres.", "λ ≈ 0.026 W/(m·K) at 20 °C"]);
  P(1, 'fis', 'arComprimido',
    ["Ar comprimido", "Energia guardada em ar sob pressão", "Comprimir o ar armazena energia que pode ser liberada depois para mover ferramentas, freios de trens e caminhões ou órgãos de tubos. É uma forma limpa de transmitir força.", "Comprimir aquece o ar e expandi-lo o esfria, por isso parte da energia se perde como calor. Algumas usinas guardam ar comprimido em cavernas subterrâneas para gerar eletricidade depois.", "Sistemas pneumáticos acionam fachadas móveis e mantêm estruturas infladas. A mesma física explica por que um pneu esquenta ao ser enchido.", "Huntorf, Alemanha (1978): ar guardado em cavernas de sal"],
    ["Compressed air", "Energy stored in pressurised air", "Compressing air stores energy that can be released later to drive tools, train and truck brakes or pipe organs. It is a clean way of transmitting force.", "Compression heats air and expansion cools it, so some energy is lost as heat. Some power plants store compressed air in underground caverns to generate electricity later.", "Pneumatic systems drive moving façades and keep inflated structures up. The same physics explains why a tyre warms as it is pumped.", "Huntorf, Germany (1978): air stored in salt caverns"]);

  P(1, 'qui', 'composicao',
    ["Composição do ar", "Uma mistura de gases, não uma substância", "O ar seco é quase todo nitrogênio e oxigênio. Argônio, dióxido de carbono e gases-traço completam o volume. O vapor d’água varia de 0 a cerca de 4%, conforme clima e lugar.", "Essa proporção é quase igual em toda a baixa atmosfera, porque o ar se mistura continuamente. O CO₂, embora pequeno em volume, responde por boa parte do efeito estufa.", "Em ambientes fechados, o CO₂ exalado sobe rápido. Medir sua concentração é uma forma simples de saber se um espaço está bem ventilado.", "N₂ 78,08 · O₂ 20,95 · Ar 0,93 (% em volume)"],
    ["Composition of air", "A mixture of gases, not one substance", "Dry air is almost all nitrogen and oxygen. Argon, carbon dioxide and trace gases make up the rest. Water vapour ranges from 0 to about 4%, depending on climate and place.", "The proportions are almost identical throughout the lower atmosphere, because air mixes constantly. CO₂, though tiny by volume, accounts for much of the greenhouse effect.", "Indoors, exhaled CO₂ builds up quickly. Measuring it is a simple way to tell whether a space is well ventilated.", "N₂ 78.08 · O₂ 20.95 · Ar 0.93 (% by volume)"]);
  P(1, 'qui', 'difusao',
    ["Difusão", "Mistura espontânea por agitação molecular", "Moléculas em movimento aleatório se espalham de onde estão concentradas para onde são escassas, sem precisar de vento. É assim que um cheiro atravessa uma sala parada.", "A difusão é lenta em distâncias grandes: sozinha, levaria horas para atravessar uma sala. Na prática, pequenas correntes de ar fazem a maior parte da mistura.", "Explica por que a exaustão localizada importa: sem fluxo de ar, poluentes e odores ficam muito tempo perto da fonte.", "Difusividade do O₂ no ar ≈ 0,2 cm²/s"],
    ["Diffusion", "Spontaneous mixing by molecular motion", "Molecules in random motion spread from where they are concentrated to where they are scarce, without any wind. That is how a smell crosses a still room.", "Diffusion is slow over long distances: on its own it would take hours to cross a room. In practice small air currents do most of the mixing.", "It explains why local extraction matters: without airflow, pollutants and odours linger near their source.", "O₂ diffusivity in air ≈ 0.2 cm²/s"]);
  P(1, 'qui', 'gases',
    ["Lei dos gases ideais", "Pressão, volume e temperatura amarrados", "Comprimir um gás aumenta sua pressão; aquecê-lo também. A relação PV = nRT descreve bem o ar em condições comuns e explica pneus, bombas e o ar que se expande e esfria ao subir.", "Quando o ar sobe e encontra pressão menor, ele se expande e esfria, mesmo sem perder calor para o entorno. É assim que nuvens se formam em correntes ascendentes.", "Estruturas infladas, câmaras pressurizadas e sistemas de ar comprimido são dimensionados a partir dessa relação.", "R = 8,314 J/(mol·K)"],
    ["Ideal gas law", "Pressure, volume and temperature bound together", "Compressing a gas raises its pressure; so does heating it. The relation PV = nRT describes ordinary air well and explains tyres, pumps and air that expands and cools as it rises.", "When air rises into lower pressure it expands and cools, even without losing heat to its surroundings. That is how clouds form in updrafts.", "Inflated structures, pressurised chambers and compressed-air systems are sized from this relation.", "R = 8.314 J/(mol·K)"]);
  P(1, 'qui', 'combustao',
    ["Combustão", "Oxidação rápida que consome o oxigênio do ar", "O fogo só se mantém com combustível, calor e oxigênio. Retirar qualquer um dos três o extingue. O ar alimenta a chama e leva embora os gases quentes que ela produz.", "Uma chama comum consome oxigênio e produz CO₂, vapor e, se faltar ar, monóxido de carbono. A fumaça quente sobe e, num ambiente fechado, se acumula sob o teto.", "O ar é aliado e risco: lareiras e fogões precisam de entrada de ar e exaustão; na proteção contra incêndio, controlar o fluxo de ar e a fumaça salva vidas.", "Chamas comuns se apagam abaixo de ~15% de O₂"],
    ["Combustion", "Rapid oxidation that consumes air’s oxygen", "Fire lasts only with fuel, heat and oxygen. Remove any one and it goes out. Air feeds the flame and carries away the hot gases it produces.", "An ordinary flame consumes oxygen and gives off CO₂, vapour and, when air is short, carbon monoxide. Hot smoke rises and, in a closed room, collects under the ceiling.", "Air is both ally and hazard: fireplaces and stoves need make-up air and flues; in fire safety, controlling airflow and smoke saves lives.", "Ordinary flames go out below ~15% O₂"]);
  P(1, 'qui', 'ozonio',
    ["Camada de ozônio", "Um filtro gasoso para a radiação ultravioleta", "Na estratosfera, moléculas de O₃ absorvem a maior parte do ultravioleta mais energético antes que ele chegue ao solo. A luz visível atravessa a camada quase intacta.", "O ozônio se forma quando a radiação UV quebra moléculas de O₂. Perto do solo, ao contrário, ele é um poluente formado por gases de escapamento sob o sol.", "Na escala do edifício, o filtro contra UV são vidros, películas e brises. O ozônio ao nível da rua é mais um motivo para afastar tomadas de ar do tráfego.", "~90% do ozônio está entre 15 e 35 km"],
    ["Ozone layer", "A gaseous filter for ultraviolet radiation", "In the stratosphere, O₃ molecules absorb most of the high-energy ultraviolet before it reaches the ground. Visible light passes through almost untouched.", "Ozone forms when UV radiation splits O₂ molecules. Near the ground, by contrast, it is a pollutant made from exhaust gases in sunlight.", "At building scale, UV filtering is done by glass, films and shading. Street-level ozone is one more reason to place air intakes away from traffic.", "~90% of ozone lies between 15 and 35 km"]);
  P(1, 'qui', 'adsorcao',
    ["Adsorção", "Superfícies que capturam moléculas do ar", "Na adsorção, moléculas de gás aderem à superfície de um sólido. O carvão ativado é tão poroso que um grama tem centenas de metros quadrados de superfície para prender odores e poluentes.", "Diferente da absorção, em que o gás penetra no material, na adsorção ele fica preso só na superfície. Quando os poros se enchem, o filtro satura e precisa ser trocado.", "Filtros de carvão em sistemas de ventilação e acabamentos porosos, como argila e certas madeiras, capturam compostos do ar interno.", "Carvão ativado: ~500–1500 m² por grama"],
    ["Adsorption", "Surfaces that capture molecules from air", "In adsorption, gas molecules stick to the surface of a solid. Activated carbon is so porous that a single gram has hundreds of square metres of surface to trap odours and pollutants.", "Unlike absorption, where gas soaks into a material, adsorption holds it only on the surface. Once the pores are full the filter is saturated and must be replaced.", "Carbon filters in ventilation systems and porous finishes such as clay and some timbers capture compounds from indoor air.", "Activated carbon: ~500–1500 m² per gram"]);
  P(1, 'qui', 'oxidacao',
    ["Oxidação", "O oxigênio do ar transforma os materiais", "O oxigênio reage lentamente com metais, óleos e madeira. O ferro vira ferrugem, o cobre ganha pátina verde e uma maçã cortada escurece.", "A ferrugem se forma com oxigênio e água juntos, por isso avança mais em ar úmido e salino. Alguns metais, como o alumínio e o aço corten, criam uma camada de óxido que protege o restante.", "Fachadas de aço corten e coberturas de cobre usam a oxidação como acabamento: o material envelhece com o ar e muda de cor ao longo dos anos.", "4Fe + 3O₂ + 6H₂O → 4Fe(OH)₃"],
    ["Oxidation", "Oxygen in the air transforms materials", "Oxygen reacts slowly with metals, oils and timber. Iron turns to rust, copper grows a green patina and a cut apple browns.", "Rust needs oxygen and water together, so it advances faster in damp, salty air. Some metals, such as aluminium and weathering steel, form an oxide layer that protects the rest.", "Weathering-steel façades and copper roofs use oxidation as a finish: the material ages with the air and changes colour over the years.", "4Fe + 3O₂ + 6H₂O → 4Fe(OH)₃"]);

  P(1, 'bio', 'alveolo',
    ["Troca alveolar", "Difusão de gases entre o ar e o sangue", "Nos pulmões, cerca de 480 milhões de alvéolos expõem o sangue ao ar através de uma membrana finíssima. O oxigênio passa ao sangue e o CO₂ faz o caminho inverso, guiados pela diferença de pressão parcial.", "Em repouso respiramos cerca de 6 litros de ar por minuto. A membrana dos alvéolos é tão fina que o oxigênio a atravessa em menos de um segundo.", "A qualidade do ar interno chega direto ao sangue. Por isso ventilação, filtragem e materiais de baixa emissão são questões de saúde, não só de conforto.", "Área de troca ≈ 70 m² num adulto"],
    ["Alveolar exchange", "Gas diffusion between air and blood", "In the lungs, some 480 million alveoli expose blood to air across an extremely thin membrane. Oxygen passes into the blood and CO₂ moves the other way, driven by differences in partial pressure.", "At rest we breathe about 6 litres of air a minute. The alveolar membrane is so thin that oxygen crosses it in under a second.", "Indoor air quality reaches the bloodstream directly. Ventilation, filtration and low-emission materials are health matters, not just comfort.", "Exchange area ≈ 70 m² in an adult"]);
  P(1, 'bio', 'fonacao',
    ["Voz", "Ar expirado transformado em som", "O ar que sai dos pulmões faz vibrar as pregas vocais na laringe. Garganta, boca e nariz moldam essa vibração em vogais, consoantes e timbre.", "A altura do som depende da tensão e do comprimento das pregas; a ressonância da boca e do nariz cria as vogais. Cantar é controlar com precisão a saída de ar.", "Salas de concerto e de aula são desenhadas para levar essa vibração do ar até o ouvinte com clareza.", "Pregas vibram ~100–250 Hz na fala"],
    ["Voice", "Exhaled air turned into sound", "Air leaving the lungs makes the vocal folds in the larynx vibrate. Throat, mouth and nose shape that vibration into vowels, consonants and timbre.", "Pitch depends on the tension and length of the folds; resonance in the mouth and nose shapes the vowels. Singing is precise control of outgoing air.", "Concert halls and lecture rooms are designed to carry this vibration of the air clearly to the listener.", "Folds vibrate ~100–250 Hz in speech"]);
  P(1, 'bio', 'olfato',
    ["Olfato", "Ler o ar quimicamente", "Moléculas voláteis carregadas pelo ar chegam ao epitélio no alto da cavidade nasal e se ligam a receptores específicos. Cada cheiro é uma combinação de receptores ativados.", "O cheiro chega por duas vias: pelo nariz ao inspirar e pela boca ao comer. As memórias olfativas são fortes porque o olfato se liga direto a áreas emocionais do cérebro.", "O cheiro faz parte da experiência de um lugar: madeira, terra molhada, jardins. Também denuncia ar parado e materiais que liberam compostos voláteis.", "~400 tipos de receptor olfativo em humanos"],
    ["Smell", "Reading the air chemically", "Volatile molecules carried by air reach the epithelium high in the nasal cavity and bind to specific receptors. Every smell is a combination of activated receptors.", "Smell arrives two ways: through the nose when inhaling and through the mouth when eating. Scent memories are vivid because smell links directly to emotional areas of the brain.", "Smell is part of how a place is experienced: timber, wet earth, gardens. It also betrays stale air and materials releasing volatile compounds.", "~400 olfactory receptor types in humans"]);

  P(1, 'mic', 'bioaerossois',
    ["Bioaerossóis", "Vida suspensa no ar", "Bactérias, esporos de fungos, pólen e vírus viajam presos a partículas e gotículas. Correntes de ar os levam por quilômetros, e a ventilação dos espaços define quanto deles respiramos.", "Partículas grandes caem rápido; as menores podem ficar horas no ar. Umidade, luz solar e ventilação influenciam quanto tempo os microrganismos sobrevivem suspensos.", "Renovação de ar, filtragem e luz natural reduzem a carga de bioaerossóis em escolas, hospitais e escritórios.", "Faixa típica de tamanho: 0,5–100 µm"],
    ["Bioaerosols", "Life suspended in air", "Bacteria, fungal spores, pollen and viruses travel on particles and droplets. Air currents carry them for kilometres, and the ventilation of a space sets how many of them we breathe.", "Large particles settle quickly; the smallest can stay aloft for hours. Humidity, sunlight and ventilation affect how long microbes survive in the air.", "Air changes, filtration and daylight lower the bioaerosol load in schools, hospitals and offices.", "Typical size range: 0.5–100 µm"]);
  P(1, 'mic', 'fermentacao',
    ["Fermentação", "Microrganismos que produzem gás", "Leveduras consomem açúcar sem oxigênio e liberam etanol e CO₂. As bolhas fazem o pão crescer e a bebida espumar: o gás produzido vira volume e textura.", "Sem oxigênio, a levedura tira menos energia do açúcar e libera o restante como etanol. O CO₂ fica preso na rede de glúten da massa e forma os alvéolos do pão.", "Adegas e salas de fermentação acumulam CO₂ junto ao piso, por ser mais pesado que o ar; esses espaços exigem ventilação baixa.", "C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂"],
    ["Fermentation", "Microbes that make gas", "Yeast consumes sugar without oxygen and releases ethanol and CO₂. The bubbles make bread rise and drinks foam: the gas becomes volume and texture.", "Without oxygen, yeast gets less energy from sugar and releases the rest as ethanol. The CO₂ is trapped in the dough’s gluten network and forms the holes in bread.", "Wine cellars and fermentation rooms collect CO₂ at floor level, since it is heavier than air; such spaces need low-level ventilation.", "C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂"]);
  P(1, 'mic', 'fixacao',
    ["Fixação de nitrogênio", "Bactérias que tiram alimento do ar", "O N₂ é o gás mais abundante do ar, mas quase nenhum ser vivo consegue usá-lo. Bactérias como o Rhizobium, nos nódulos das raízes de leguminosas, o convertem em amônia que a planta absorve.", "Quebrar a ligação tripla do N₂ exige muita energia; a enzima nitrogenase faz isso à temperatura ambiente. O equivalente industrial, o processo Haber-Bosch, usa altas pressões e temperaturas.", "Telhados verdes e jardins com leguminosas enriquecem o solo sem adubo químico: o ar vira nutriente.", "N₂ + 8H⁺ + 8e⁻ → 2NH₃ + H₂"],
    ["Nitrogen fixation", "Bacteria that feed on the air", "N₂ is the most abundant gas in air, yet almost no living thing can use it. Bacteria such as Rhizobium, in the root nodules of legumes, turn it into ammonia the plant can absorb.", "Breaking N₂’s triple bond takes a lot of energy; the enzyme nitrogenase does it at room temperature. The industrial equivalent, the Haber–Bosch process, needs high pressure and heat.", "Green roofs and gardens with legumes enrich soil without chemical fertiliser: air becomes nutrient.", "N₂ + 8H⁺ + 8e⁻ → 2NH₃ + H₂"]);
  P(1, 'mic', 'aerobios',
    ["Aeróbios e anaeróbios", "Microrganismos que precisam do ar, ou fogem dele", "Alguns microrganismos só vivem com oxigênio; outros morrem na presença dele; muitos alternam. Num tubo de cultura, cada grupo cresce na altura em que a quantidade de oxigênio lhe convém.", "Os anaeróbios dominam lugares sem ar: o fundo de lagos, o intestino, o solo encharcado. A decomposição sem oxigênio libera metano e gás sulfídrico, de cheiro forte.", "Composteiras e sistemas de esgoto dependem do controle do ar: com aeração a decomposição é limpa; sem ela, produz odores e metano.", "Aeróbios crescem no topo do tubo; anaeróbios, no fundo"],
    ["Aerobes and anaerobes", "Microbes that need air, or avoid it", "Some microbes live only with oxygen; others die in its presence; many switch between the two. In a culture tube, each group grows at the depth where the oxygen level suits it.", "Anaerobes dominate airless places: lake beds, the gut, waterlogged soil. Decomposition without oxygen releases methane and hydrogen sulphide, with its strong smell.", "Composters and sewage systems depend on controlling air: with aeration, decomposition is clean; without it, it produces odours and methane.", "Aerobes grow at the top of the tube; anaerobes at the bottom"]);

  P(1, 'fau', 'aves',
    ["Pulmão das aves", "Fluxo unidirecional de ar", "Sacos aéreos funcionam como foles: o ar atravessa o pulmão sempre no mesmo sentido, na inspiração e na expiração. A troca contínua sustenta o voo em grandes altitudes.", "Os pulmões das aves são rígidos; quem infla e esvazia são os sacos aéreos, que chegam a ocupar espaços dentro dos ossos. O sistema é mais eficiente que o dos mamíferos.", "Um modelo de ventilação de fluxo único: o ar entra por um lado, atravessa o espaço e sai pelo outro, sem misturar ar novo com ar viciado.", "9 sacos aéreos na maioria das espécies"],
    ["Bird lungs", "One-way airflow", "Air sacs work like bellows: air crosses the lung in the same direction on both inhalation and exhalation. Continuous exchange supports flight at high altitude.", "Bird lungs are rigid; the air sacs do the inflating and emptying, and some even extend into the bones. The system is more efficient than that of mammals.", "A model for one-way ventilation: air enters on one side, crosses the space and leaves on the other, without mixing fresh and stale air.", "9 air sacs in most species"]);
  P(1, 'fau', 'cupinzeiro',
    ["Cupinzeiro", "Ventilação passiva de um edifício animal", "O monte troca gases pelas paredes porosas e por canais internos. As oscilações diárias de temperatura fazem o ar circular pela estrutura e renovam o ar do ninho, sem nenhum mecanismo ativo.", "Pesquisas recentes mostram que o monte respira num ciclo diário: de dia o ar sobe pelos canais junto à superfície e desce pela chaminé central; à noite, o sentido se inverte.", "A referência clássica de biomimética na ventilação passiva, retomada no Volume II pelo Eastgate Centre.", "Inspirou o Eastgate Centre, Harare (1996)"],
    ["Termite mound", "Passive ventilation of an animal building", "The mound exchanges gases through its porous walls and internal channels. Daily temperature swings drive air around the structure and refresh the nest, with no active mechanism.", "Recent research shows the mound breathes on a daily cycle: by day air rises in the channels near the surface and sinks down the central chimney; at night the direction reverses.", "The classic biomimicry reference for passive ventilation, taken up in Volume II by the Eastgate Centre.", "Inspired the Eastgate Centre, Harare (1996)"]);
  P(1, 'fau', 'toca',
    ["Toca do cão-da-pradaria", "Ventilação induzida pelo vento", "As entradas têm alturas e formas diferentes e ficam sob velocidades de vento distintas. A diferença de pressão resultante puxa ar por todo o túnel, como um Venturi enterrado.", "O biólogo Steven Vogel mostrou que mesmo um vento fraco basta para renovar o ar da toca. Os animais moldam os montes de terra das entradas, reforçando o efeito.", "O mesmo princípio aparece em exaustores eólicos e em edifícios com aberturas em alturas diferentes.", "Descrito por Vogel, Ellington e Kilgore (1973)"],
    ["Prairie dog burrow", "Wind-induced ventilation", "The entrances differ in height and shape and sit in different wind speeds. The resulting pressure difference draws air through the whole tunnel, like a buried Venturi.", "Biologist Steven Vogel showed that even a light breeze is enough to renew the burrow’s air. The animals shape the earth mounds at the entrances, strengthening the effect.", "The same principle appears in wind-driven roof ventilators and in buildings with openings at different heights.", "Described by Vogel, Ellington and Kilgore (1973)"]);
  P(1, 'fau', 'voo',
    ["Sustentação", "Força criada pelo ar contornando uma asa", "A forma e o ângulo da asa desviam o ar para baixo e geram menor pressão no dorso. Aves, morcegos e insetos exploram esse efeito; sementes e folhas planam pelo mesmo princípio.", "A sustentação cresce com o quadrado da velocidade e com a área da asa. Abaixo de certa velocidade, ou com ângulo excessivo, o fluxo se descola e a asa perde sustentação.", "Coberturas leves e balanços longos sofrem sucção do vento pelo mesmo efeito e precisam ser ancorados contra o arrancamento.", "L = ½ρv²·S·C_L"],
    ["Lift", "Force created by air flowing around a wing", "The shape and angle of a wing deflect air downward and lower the pressure above it. Birds, bats and insects exploit the effect; seeds and leaves glide on the same principle.", "Lift grows with the square of speed and with wing area. Below a certain speed, or at too steep an angle, the flow separates and the wing stalls.", "Light roofs and long cantilevers feel wind suction from the same effect and must be anchored against uplift.", "L = ½ρv²·S·C_L"]);
  P(1, 'fau', 'formacaoV',
    ["Voo em V", "Aproveitar o ar que sobe atrás de outra asa", "Cada asa deixa nas pontas vórtices que empurram o ar para cima logo atrás e ao lado. Aves em V se posicionam nesse ar ascendente e gastam menos energia; a liderança se reveza.", "Um estudo com íbis-eremitas mostrou que as aves sincronizam até o batimento das asas para aproveitar a corrente certa.", "Mostra que um conjunto pode aproveitar o ar perturbado por cada elemento, como fileiras de edifícios ou turbinas eólicas posicionadas em grupo.", "Portugal et al., Nature (2014), íbis-eremita"],
    ["V formation", "Riding the air that rises behind another wing", "Each wing sheds tip vortices that push air upward just behind and beside it. Birds in a V sit in this rising air and spend less energy; the lead position rotates.", "A study of northern bald ibises showed the birds even synchronise their wingbeats to catch the right current.", "It shows how a group can use the air disturbed by each member, as with rows of buildings or wind turbines placed in arrays.", "Portugal et al., Nature (2014), northern bald ibis"]);
  P(1, 'fau', 'sino',
    ["Sino de mergulho", "Uma casa de ar construída debaixo d’água", "A aranha-d’água tece uma cúpula de seda entre as plantas e a enche com bolhas trazidas da superfície. O oxigênio da água se difunde para dentro da bolha, que funciona como uma guelra.", "Como a bolha troca gases com a água, a aranha só precisa renová-la de vez em quando, e pode passar horas submersa sem subir à superfície.", "Uma das poucas “casas de ar” construídas por um animal: uma membrana leve que retém um volume de ar e o troca com o meio pela superfície.", "Argyroneta aquatica"],
    ["Diving bell", "An air house built underwater", "The water spider weaves a silk dome among plants and fills it with bubbles carried down from the surface. Oxygen in the water diffuses into the bubble, which works as a gill.", "Because the bubble exchanges gases with the water, the spider only needs to top it up now and then, and can stay submerged for hours.", "One of the few “air houses” built by an animal: a light membrane holding a volume of air that exchanges gases with its surroundings through its surface.", "Argyroneta aquatica"]);
  P(1, 'fau', 'balonismo',
    ["Balonismo", "Aranhas que viajam pelo ar", "Filhotes de aranha soltam fios de seda e decolam, carregados pelo vento e também pelo campo elétrico natural da atmosfera. Assim colonizam ilhas e cruzam centenas de quilômetros.", "Darwin registrou aranhas pousando no Beagle longe da costa. Experimentos de 2018 mostraram que elas sentem o campo elétrico com os pelos das patas e decolam mesmo sem vento.", "Inspiração para estruturas de fios e membranas ultraleves, em que o ar faz a maior parte do trabalho.", "Papel do campo elétrico demonstrado em 2018"],
    ["Ballooning", "Spiders that travel by air", "Young spiders release silk threads and take off, carried by the wind and by the atmosphere’s natural electric field. This is how they colonise islands and cross hundreds of kilometres.", "Darwin recorded spiders landing on the Beagle far from shore. Experiments in 2018 showed they sense the electric field through the hairs on their legs and take off even without wind.", "Inspiration for ultralight thread and membrane structures, where air does most of the work.", "Role of the electric field shown in 2018"]);
  P(1, 'fau', 'bexiga',
    ["Bexiga natatória", "Um balão de gás para controlar a flutuação", "Muitos peixes têm um saco de gás no corpo. Ajustando o volume de gás, eles ficam parados em qualquer profundidade sem gastar energia nadando.", "O gás vem do sangue, por uma glândula especial, ou é engolido na superfície. Ao subir rápido o gás se expande, por isso peixes de águas profundas sofrem quando trazidos à tona.", "Um princípio de lastro variável, usado em submarinos e em estruturas flutuantes que ajustam sua altura na água.", "~5% do volume em peixes marinhos, ~7% nos de água doce"],
    ["Swim bladder", "A gas balloon for buoyancy control", "Many fish carry a gas sac inside the body. By adjusting the gas volume they hover at any depth without spending energy swimming.", "The gas comes from the blood through a special gland, or is gulped at the surface. Rising fast makes it expand, which is why deep-sea fish suffer when hauled up.", "A variable-ballast principle used in submarines and in floating structures that adjust their height in the water.", "~5% of body volume in marine fish, ~7% in freshwater fish"]);

  P(1, 'flo', 'estomatos',
    ["Estômatos", "Poros que regulam a troca gasosa da folha", "Duas células-guarda incham ou murcham e abrem ou fecham o poro. Por ele entra o CO₂ da fotossíntese e saem oxigênio e vapor d’água: a planta controla quanto respira e quanto transpira.", "Os estômatos fecham quando falta água ou faz muito calor, protegendo a planta mas reduzindo a fotossíntese. A água que sai por eles resfria a folha.", "Fachadas responsivas que abrem e fecham com umidade ou calor seguem a mesma ideia de pele regulável.", "Dezenas a centenas de estômatos por mm²"],
    ["Stomata", "Pores that regulate a leaf’s gas exchange", "Two guard cells swell or slacken to open or close the pore. CO₂ for photosynthesis enters through it, and oxygen and water vapour leave: the plant controls how much it breathes and transpires.", "Stomata close when water is short or heat is extreme, protecting the plant but slowing photosynthesis. The water leaving through them cools the leaf.", "Responsive façades that open and close with humidity or heat follow the same idea of an adjustable skin.", "Tens to hundreds of stomata per mm²"]);
  P(1, 'flo', 'fotossintese',
    ["Fotossíntese", "A planta que refaz o ar", "Com luz, a folha combina o CO₂ do ar com água e produz açúcar, devolvendo oxigênio. Quase todo o O₂ que respiramos foi liberado por organismos fotossintetizantes.", "Cerca de metade do oxigênio da Terra vem do fitoplâncton dos oceanos; a outra metade, de plantas terrestres. As florestas também armazenam o carbono retirado do ar.", "Vegetação em pátios e coberturas sombreia, resfria por transpiração e participa das trocas gasosas do lugar, mas não substitui a ventilação de um ambiente fechado.", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂"],
    ["Photosynthesis", "The plant that remakes the air", "With light, a leaf combines CO₂ from the air with water to make sugar, returning oxygen. Almost all the O₂ we breathe was released by photosynthetic organisms.", "Roughly half of Earth’s oxygen comes from ocean phytoplankton; the rest from land plants. Forests also store the carbon they take from the air.", "Planting in courtyards and on roofs shades, cools by transpiration and takes part in local gas exchange, but it does not replace ventilation in a closed room.", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂"]);
  P(1, 'flo', 'transpiracao',
    ["Transpiração", "A planta que bombeia água para o ar", "A água evapora pelos estômatos e puxa, como num canudo, a coluna de água desde as raízes. Uma árvore grande pode liberar centenas de litros de vapor por dia.", "A evaporação resfria a folha e o ar ao redor. Florestas inteiras alimentam a umidade que forma chuvas longe dali, como os “rios voadores” da Amazônia.", "Árvores em ruas e pátios resfriam o ar por transpiração e sombra. Parques podem ficar alguns graus mais frescos que as ruas vizinhas.", "~97% da água absorvida sai como vapor"],
    ["Transpiration", "The plant that pumps water into the air", "Water evaporates through the stomata and pulls the water column up from the roots, like a straw. A large tree can release hundreds of litres of vapour a day.", "Evaporation cools the leaf and the air around it. Whole forests feed the moisture that falls as rain far away, like the “flying rivers” of the Amazon.", "Trees in streets and courtyards cool the air through transpiration and shade. Parks can be a few degrees cooler than surrounding streets.", "~97% of absorbed water leaves as vapour"]);
  P(1, 'flo', 'liquens',
    ["Líquens", "Organismos que medem a qualidade do ar", "Líquens absorvem água e nutrientes direto do ar e da chuva, sem raízes. Por isso acumulam poluentes e somem onde o ar é sujo: sua presença indica ar limpo.", "São uma parceria entre um fungo e uma alga ou cianobactéria. Desde o século XIX, observar líquens em troncos serve para mapear a poluição por enxofre em cidades.", "Bioindicadores baratos: observar líquens em muros e árvores revela a qualidade do ar de um bairro antes de qualquer sensor.", "Sensíveis sobretudo ao SO₂"],
    ["Lichens", "Organisms that gauge air quality", "Lichens take water and nutrients straight from air and rain, with no roots. They therefore accumulate pollutants and vanish where air is dirty: their presence signals clean air.", "They are a partnership between a fungus and an alga or cyanobacterium. Since the 19th century, surveying lichens on tree trunks has been used to map sulphur pollution in cities.", "Cheap bioindicators: looking at lichens on walls and trees reveals a neighbourhood’s air quality before any sensor.", "Especially sensitive to SO₂"]);
  P(1, 'flo', 'anemocoria',
    ["Anemocoria", "Dispersão de sementes pelo vento", "Plumas, asas e sementes leves aumentam o arrasto e reduzem a velocidade de queda, e o vento leva a semente para longe. O dente-de-leão forma um anel de vórtice estável logo acima do pappus.", "Sementes aladas como as do bordo giram como hélices; as plumosas, como o dente-de-leão, flutuam como paraquedas porosos. Algumas viajam dezenas de quilômetros.", "Paraquedas porosos e formas estabilizadas pelo arrasto inspiram coberturas leves e elementos de sombra móveis.", "Pappus com ~90% de porosidade"],
    ["Anemochory", "Seed dispersal by wind", "Plumes, wings and light seeds increase drag and slow their fall, so the wind carries the seed far away. The dandelion forms a stable vortex ring just above its pappus.", "Winged seeds like the maple’s spin like rotors; plumed ones like the dandelion float like porous parachutes. Some travel tens of kilometres.", "Porous parachutes and drag-stabilised forms inspire light canopies and moving shade elements.", "Pappus ~90% porous"]);
  P(1, 'flo', 'aerenquima',
    ["Aerênquima", "Tecido vegetal com canais de ar", "Plantas de áreas alagadas formam lacunas internas que levam oxigênio das folhas às raízes submersas. O ar passa a fazer parte da estrutura, aliviando peso e garantindo a respiração em solo sem oxigênio.", "O aerênquima surge pela morte programada de células ou pela separação entre elas. Arroz, juncos e ninfeias dependem dele.", "Um material que é parte sólido, parte ar: leveza estrutural e transporte de gases no mesmo tecido.", "Pode passar de 40% do volume da raiz"],
    ["Aerenchyma", "Plant tissue with air channels", "Wetland plants form internal spaces that carry oxygen from the leaves to submerged roots. Air becomes part of the structure, lightening it and allowing respiration in oxygen-free soil.", "Aerenchyma forms either by programmed cell death or by cells pulling apart. Rice, rushes and water lilies depend on it.", "A material that is part solid, part air: structural lightness and gas transport in one tissue.", "Can exceed 40% of root volume"]);
  P(1, 'flo', 'pneumatoforos',
    ["Pneumatóforos", "Raízes que sobem para respirar", "No mangue, a lama é pobre em oxigênio. Algumas árvores emitem raízes verticais que furam a superfície; pequenos poros chamados lenticelas captam ar na maré baixa e o levam às raízes enterradas.", "Na maré alta as lenticelas ficam submersas; na baixa, o ar volta a entrar. Uma única árvore de mangue-preto pode ter milhares dessas raízes.", "Elementos que emergem de um meio sem ar para buscá-lo: uma imagem direta das tomadas de ar elevadas.", "Típico de Avicennia, o mangue-preto"],
    ["Pneumatophores", "Roots that rise to breathe", "Mangrove mud is poor in oxygen. Some trees send up vertical roots that pierce the surface; small pores called lenticels take in air at low tide and pass it to the buried roots.", "At high tide the lenticels are submerged; at low tide air flows back in. A single black mangrove can have thousands of these roots.", "Elements rising out of an airless medium to reach air: a direct image of raised air intakes.", "Typical of Avicennia, the black mangrove"]);

  P(1, 'nat', 'nuvem',
    ["Nuvem", "Ar que subiu até condensar", "Ao subir, o ar se expande e esfria. Quando chega ao ponto de orvalho, o vapor condensa em gotículas sobre partículas de poeira e sal: a base plana de uma nuvem marca esse nível.", "Uma nuvem cúmulo média pesa centenas de toneladas de água, sustentadas por correntes ascendentes. As gotículas são tão pequenas que caem muito devagar até se juntarem em gotas de chuva.", "A nuvem é a referência poética e técnica da arquitetura do ar: volume sem paredes, definido por temperatura e umidade.", "Ar seco que sobe esfria ~9,8 °C por km"],
    ["Cloud", "Air that rose until it condensed", "As air rises it expands and cools. When it reaches its dew point, vapour condenses into droplets on specks of dust and salt: the flat base of a cloud marks that level.", "An average cumulus holds hundreds of tonnes of water, held up by updrafts. The droplets are so small they fall very slowly until they merge into raindrops.", "The cloud is the poetic and technical reference for an architecture of air: volume without walls, defined by temperature and humidity.", "Rising dry air cools ~9.8 °C per km"]);
  P(1, 'nat', 'foehn',
    ["Vento foehn", "Ar que desce a montanha seco e quente", "O ar úmido sobe a encosta, esfria, chove e perde água. Ao descer pelo outro lado ele é comprimido e aquece mais rápido do que esfriou, chegando seco e quente ao vale.", "O nome vem dos Alpes; nas Montanhas Rochosas o mesmo vento se chama chinook. Ele derrete neve rapidamente e aumenta o risco de incêndios.", "Mostra como o relevo transforma o ar que chega a um terreno: o mesmo vento pode ser úmido de um lado da serra e seco do outro.", "Pode elevar a temperatura em mais de 10 °C em poucas horas"],
    ["Foehn wind", "Air that comes down the mountain dry and warm", "Moist air climbs the slope, cools, rains and loses water. Descending the other side it is compressed and warms faster than it cooled, reaching the valley dry and hot.", "The name comes from the Alps; in the Rocky Mountains the same wind is called the chinook. It melts snow quickly and raises fire risk.", "It shows how terrain transforms the air reaching a site: the same wind can be humid on one side of a ridge and dry on the other.", "Can raise temperature by more than 10 °C in a few hours"]);
  P(1, 'nat', 'ilhaCalor',
    ["Ilha de calor", "A cidade que aquece o próprio ar", "Asfalto, concreto e telhados escuros absorvem sol de dia e devolvem calor à noite. Menos vegetação e mais calor de motores e aparelhos deixam o ar urbano mais quente que o do campo vizinho.", "O efeito é mais forte à noite e em dias sem vento. Ruas estreitas entre prédios altos prendem o calor irradiado pelas fachadas.", "Coberturas claras ou verdes, sombra de árvores, água e corredores de ventilação reduzem o efeito na escala do bairro.", "Diferenças noturnas podem passar de 5 °C"],
    ["Urban heat island", "The city that warms its own air", "Asphalt, concrete and dark roofs absorb sun by day and give heat back at night. Less vegetation and more heat from engines and appliances make city air warmer than the surrounding countryside.", "The effect is strongest at night and on still days. Narrow streets between tall buildings trap heat radiated by the façades.", "Light or green roofs, tree shade, water and ventilation corridors reduce the effect at neighbourhood scale.", "Night-time differences can exceed 5 °C"]);
  P(1, 'fis', 'camadaLimite',
    ["Camada limite", "O ar que desacelera junto às superfícies", "O ar em contato com uma superfície fica praticamente parado e ganha velocidade com a distância. Essa faixa de transição é a camada limite, do milímetro sobre uma folha às centenas de metros sobre uma cidade.", "Dentro dela acontece quase toda a troca de calor e umidade entre o ar e os sólidos. Superfícies rugosas engrossam a camada; o vento forte a afina.", "Explica por que o vento é mais fraco no térreo do que no alto de uma torre e por que a superfície de uma parede troca calor de forma diferente em dias de vento.", "Resistência superficial externa típica: Rse = 0,04 m²·K/W"],
    ["Boundary layer", "Air that slows down near surfaces", "Air touching a surface is practically still and gains speed with distance. That transition band is the boundary layer, from a millimetre over a leaf to hundreds of metres over a city.", "Almost all heat and moisture exchange between air and solids happens inside it. Rough surfaces thicken the layer; strong wind thins it.", "It explains why wind is weaker at ground level than at the top of a tower, and why a wall’s surface exchanges heat differently on windy days.", "Typical external surface resistance: Rse = 0.04 m²·K/W"]);
  P(1, 'fis', 'helmholtz',
    ["Ressonador de Helmholtz", "Uma massa de ar que vibra como mola", "Soprar sobre o gargalo de uma garrafa faz o ar do gargalo oscilar sobre a “mola” de ar do corpo. A frequência depende do volume da cavidade e das dimensões do gargalo.", "Hermann von Helmholtz descreveu o ressonador no século XIX para analisar sons. Cada ressonador responde a uma faixa estreita de frequências.", "Painéis perfurados ou ranhurados sobre uma câmara de ar funcionam como ressonadores e absorvem sons graves em auditórios e estúdios.", "f = (c/2π)·√(A / V·L)"],
    ["Helmholtz resonator", "A mass of air that bounces like a spring", "Blowing across a bottle’s neck makes the air in the neck oscillate on the “spring” of air in the body. The pitch depends on the cavity volume and the neck’s dimensions.", "Hermann von Helmholtz described the resonator in the 19th century to analyse sound. Each resonator responds to a narrow band of frequencies.", "Perforated or slotted panels over an air cavity act as resonators and absorb low frequencies in auditoria and studios.", "f = (c/2π)·√(A / V·L)"]);
  P(1, 'qui', 'higroscopia',
    ["Higroscopia", "Materiais que trocam vapor com o ar", "Madeira, terra crua, cal e papel absorvem vapor quando o ar está úmido e o devolvem quando ele seca. Seu teor de água acompanha a umidade do ambiente.", "Essa troca envolve calor: ao absorver vapor o material aquece um pouco, ao liberar ele esfria. Também explica por que a madeira incha e encolhe com as estações.", "Acabamentos higroscópicos estabilizam a umidade interna e reduzem picos que causam desconforto e condensação.", "Madeira a 20 °C e 65% UR: ~12% de umidade"],
    ["Hygroscopy", "Materials that trade vapour with air", "Timber, raw earth, lime and paper absorb vapour when air is humid and release it as the air dries. Their moisture content follows the room’s humidity.", "The exchange involves heat: absorbing vapour warms the material slightly, releasing it cools it. It also explains why timber swells and shrinks with the seasons.", "Hygroscopic finishes stabilise indoor humidity and soften the peaks that cause discomfort and condensation.", "Timber at 20 °C and 65% RH: ~12% moisture content"]);
  P(1, 'qui', 'cov',
    ["Compostos voláteis", "Química que evapora dos objetos", "Tintas, colas, vernizes, móveis novos e produtos de limpeza liberam compostos orgânicos voláteis no ar. O “cheiro de novo” é, em boa parte, isso.", "A emissão é maior logo após a instalação e cai com o tempo; calor e umidade a aceleram. Alguns compostos, como o formaldeído, irritam olhos e vias respiratórias.", "Escolher materiais de baixa emissão e ventilar bastante nas primeiras semanas de uso protege a qualidade do ar interno.", "OMS: formaldeído ≤ 0,1 mg/m³ (30 min)"],
    ["Volatile compounds", "Chemistry evaporating from objects", "Paints, glues, varnishes, new furniture and cleaning products release volatile organic compounds into the air. The “new smell” is largely that.", "Emissions peak right after installation and fall over time; heat and humidity speed them up. Some compounds, such as formaldehyde, irritate eyes and airways.", "Choosing low-emission materials and ventilating heavily in the first weeks of use protects indoor air quality.", "WHO: formaldehyde ≤ 0.1 mg/m³ (30 min)"]);
  P(1, 'bio', 'ofego',
    ["Ofego", "Respirar rápido para resfriar", "Cães e muitas aves têm poucas glândulas de suor. Para perder calor, respiram rápido e superficialmente, fazendo o ar passar sobre a língua e as vias úmidas, onde a água evapora.", "A respiração rápida e curta movimenta muito ar sobre as superfícies úmidas sem aumentar tanto a troca nos pulmões, evitando perder CO₂ demais.", "Mostra que resfriar por evaporação depende de mover ar sobre uma superfície molhada, o mesmo princípio de fontes e paredes úmidas ventiladas.", "Centenas de respirações por minuto em cães"],
    ["Panting", "Breathing fast to cool down", "Dogs and many birds have few sweat glands. To shed heat they breathe fast and shallow, moving air over the tongue and moist airways, where water evaporates.", "Fast, shallow breathing moves a lot of air over wet surfaces without greatly increasing exchange in the lungs, avoiding losing too much CO₂.", "It shows that evaporative cooling depends on moving air across a wet surface, the same principle as ventilated fountains and wet walls.", "Hundreds of breaths per minute in dogs"]);
  P(1, 'mic', 'mofo',
    ["Mofo", "Fungos que crescem onde o ar condensa", "Esporos de fungos estão sempre no ar. Basta uma superfície fria e úmida por alguns dias para que germinem e formem manchas, sobretudo em cantos, atrás de móveis e em paredes externas.", "O risco depende da umidade junto à superfície, não da média da sala: um canto frio pode estar perto da saturação mesmo com o ar do ambiente seco.", "Isolamento contínuo, sem pontes térmicas, e ventilação que remova o vapor de banhos e cozinhas são a forma de prevenção.", "Risco com umidade na superfície acima de ~80%"],
    ["Mould", "Fungi that grow where air condenses", "Fungal spores are always in the air. A cold, damp surface for a few days is enough for them to germinate and form stains, especially in corners, behind furniture and on external walls.", "The risk depends on humidity at the surface, not the room average: a cold corner can be near saturation even when the room air is dry.", "Continuous insulation without thermal bridges, and ventilation that removes vapour from bathrooms and kitchens, are the prevention.", "Risk above ~80% surface relative humidity"]);
  P(1, 'fau', 'colmeia',
    ["Colmeia ventilada", "Abelhas que climatizam a casa", "Operárias se posicionam na entrada e batem as asas em sincronia, criando uma corrente que renova o ar, retira o calor e evapora a água do néctar.", "Em dias quentes, outras abelhas espalham gotas de água nos favos e a ventilação as evapora, resfriando a colmeia. No frio, elas se agrupam e tremem os músculos para gerar calor.", "Um sistema de climatização coletivo e distribuído: muitos pequenos ventiladores coordenados em vez de um único equipamento.", "Ninho de cria mantido perto de 35 °C"],
