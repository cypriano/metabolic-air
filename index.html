  function renderFilters() {
    const vn = vnum();
    if (!vn) { nav.hidden = true; nav.innerHTML = ''; return; }
    nav.hidden = false;
    const counts = {}; VOL[vn].forEach(p => counts[p.dom] = (counts[p.dom] || 0) + 1);
    nav.innerHTML = [['all', u('all'), VOL[vn].length], ...ORDER[vn].map(d => [d, pick(DOM[d]), counts[d]])]
      .map(([d, name, n]) => `<button type="button" id="f-${d}" data-dom="${d}" aria-pressed="${filter === d}">${name}<sup>${n}</sup></button>`).join('') +
      (vn === 3 ? `<span class="cover-tg" role="group" aria-label="${u('order')}"><span>${u('order')}</span>${[['asc', u('oAsc')], ['desc', u('oDesc')], ['grp', u('oGrp')]].map(([v, t]) => `<button type="button" id="so-${v}" data-sort="${v}" aria-pressed="${sort3 === v}">${t}</button>`).join('')}</span>` : '') +
      `<span class="cover-tg" role="group" aria-label="${u('cover')}"><span>${u('cover')}</span><button type="button" id="cv-art" data-cover="art" aria-pressed="${coverMode === 'art'}">${u('coverArt')}</button><button type="button" id="cv-photo" data-cover="photo" aria-pressed="${coverMode === 'photo'}">${u('coverPhoto')}</button></span>`;
  }

  function plateCard(p) {
    const o = origins(p)[0] && BY[origins(p)[0]], n = photosOf(p.key).length;
    return `<article class="plate${isSaved(p.key) ? ' saved' : ''}" id="p-${p.key}" data-k="${p.key}" data-dom="${p.dom}" tabindex="-1" aria-labelledby="t-${p.key}"${filter !== 'all' && p.dom !== filter ? ' hidden' : ''}>
      <div class="plate-head"><span>${u('plate')} ${p.num}${p.vol === 3 ? ` · ${yearLabel(p)}` : ''}</span><span>${pick(DOM[p.dom])}</span></div>
      <button type="button" class="open-fig art" data-act="open" data-k="${p.key}" data-slot="${p.key}" aria-label="${u('more')}: ${tx(p, 0)}">${figInner(p)}</button>
      <div class="plate-body">
        <h2 id="t-${p.key}">${tx(p, 0)}</h2>
        <p class="trait"><b>${u('trait')}</b>${tx(p, 1)}</p>
        <p class="desc">${tx(p, 2)}</p>
        ${o ? `<button type="button" class="origin" data-act="go" data-k="${o.key}">${u('origin')} ${o.num} ${tx(o, 0)}</button>` : ''}
      </div>
      <div class="acts"><button type="button" data-act="open" data-k="${p.key}">${u('more')}</button>${p.vol > 1 || n ? `<button type="button" data-act="photos" data-k="${p.key}" data-pc="${p.key}">${u('photos')}${n ? ` · ${n}` : ''}</button>` : ''}${saveBtn(p.key)}</div>
      <div class="datum" data-label="${dataLabel(p)}">${tx(p, 5)}</div>
    </article>`;
  }

  function renderGallery() { main.className = 'grid'; main.innerHTML = listFor(vnum()).map(plateCard).join(''); setFoot(); }

  function renderMural() {
    main.className = '';
    const note = `<p class="store-note" id="store-note">${mode === 'remote' ? u('remote') : u('local')}</p>`;
    if (!items.length) {
      main.innerHTML = note + `<div class="board"><div class="empty"><strong>${u('emptyT')}</strong><p>${u('emptyS')}</p><div class="acts" style="margin:6px 0 0"><button type="button" data-act="view" data-view="v1">${u('browse')}</button></div></div></div>`;
    } else {
      main.innerHTML = note + `<div class="board">${items.map((it, i) => {
        const p = BY[it.k];
        return `<article class="tile" data-k="${p.key}">
          <div class="plate-head"><span>${u('plate')} ${p.num}</span><span>${pick(DOM[p.dom])}</span></div>
          <button type="button" class="open-fig art" data-act="open" data-k="${p.key}" data-slot="${p.key}" aria-label="${u('more')}: ${tx(p, 0)}">${figInner(p)}</button>
          <h3>${tx(p, 0)}</h3>
          <p class="trait">${tx(p, 1)}</p>
          <label for="note-${p.key}">${u('note')}</label>
          <textarea id="note-${p.key}" data-k="${p.key}" placeholder="${u('notePh')}"></textarea>
          <div class="acts">
            <button type="button" data-act="mv" data-d="-1" data-k="${p.key}" aria-label="${u('moveB')}"${i === 0 ? ' disabled' : ''}>${u('back')}</button>
            <button type="button" data-act="open" data-k="${p.key}">${u('more')}</button>
            <button type="button" data-act="save" data-k="${p.key}">${u('remove')}</button>
            <button type="button" data-act="mv" data-d="1" data-k="${p.key}" aria-label="${u('moveF')}"${i === items.length - 1 ? ' disabled' : ''}>${u('fwd')}</button>
          </div>
        </article>`;
      }).join('')}</div>`;
      items.forEach(it => { const ta = $('note-' + it.k); if (ta) ta.value = it.note; });
    }
    setFoot();
  }

  function setFoot() {
    const vn = vnum();
    if (!vn) { $('foot-l').textContent = `Air_ · ${u('boardCt')(items.length)}`; return; }
    const n = VOL[vn].filter(p => filter === 'all' || p.dom === filter).length;
    $('foot-l').textContent = `Air_ · ${u('vol')} ${ROMAN[vn]} · ${n} ${u('plates')}`;
  }
  const updateStoreNote = () => { const n = $('store-note'); if (n) n.textContent = mode === 'remote' ? u('remote') : u('local'); };

  function render() {
    renderHeader(); renderFilters();
    if (view === 'mural') renderMural(); else renderGallery();
    if (openKey && dlg.open) renderDetail(openKey);
  }

  function refreshSaved() {
    const ct = $('mural-ct'); if (ct) ct.textContent = u('boardCt')(items.length);
    document.querySelectorAll('.plate[data-k]').forEach(el => {
      const s = isSaved(el.dataset.k); el.classList.toggle('saved', s);
      const b = el.querySelector('[data-act="save"]'); if (b) { b.setAttribute('aria-pressed', s); b.querySelector('span').textContent = s ? u('saved') : u('save'); }
    });
    if (dlg.open && openKey) { const b = dlg.querySelector('[data-act="save"]'); if (b) { const s = isSaved(openKey); b.setAttribute('aria-pressed', s); b.querySelector('span').textContent = s ? u('saved') : u('save'); } }
    if (view === 'mural') { const typing = document.activeElement && document.activeElement.tagName === 'TEXTAREA'; if (!typing) renderMural(); else updateStoreNote(); }
    setFoot();
  }

  // update covers and photo counts in place
  function refreshPhotos() {
    document.querySelectorAll('[data-slot]').forEach(el => { const p = BY[el.dataset.slot]; const want = coverOf(p.key) || 'art', has = el.dataset.cv || 'art'; if (want !== has) { el.innerHTML = figInner(p); el.dataset.cv = want; } });
    document.querySelectorAll('[data-pc]').forEach(b => { const n = photosOf(b.dataset.pc).length; b.textContent = `${u('photos')}${n ? ` · ${n}` : ''}`; });
    if (dlg.open && openKey) renderDetail(openKey);
  }

  /* ───────── detail sheet ───────── */
  function seqFor(k) {
    if (view === 'mural') return items.map(i => i.k);
    const p = BY[k];
    return listFor(p.vol).filter(x => p.vol !== vnum() || filter === 'all' || x.dom === filter).map(x => x.key);
  }
  function relSection(label, keys) {
    return keys.length ? `<div class="sec"><b>${label}</b><div class="rel">${keys.map(r => `<button type="button" class="origin" data-act="open" data-k="${r}">${BY[r].num} ${tx(BY[r], 0)}</button>`).join('')}</div></div>` : '';
  }
  function photoPane(p) {
    const ps = photosOf(p.key), canEdit = !!assetsNS && !!phCol, ids = ps;
    if (dIdx >= ps.length) dIdx = 0;
    let h = '';
    if (ps.length) {
      const cur = ps[dIdx];
      h += `<div class="pmain"><img class="ph-big" data-k="${p.key}" src="${esc(cur.src)}" alt="${tx(p, 0)} · ${dIdx + 1}/${ps.length}"></div>`;
      if (cur.cur) h += `<p class="credit">${u('photoBy')} ${esc(cur.cur.author)} · ${esc(cur.cur.license)} · <a href="${esc(cur.cur.page)}" target="_blank" rel="noopener noreferrer">Wikimedia Commons ↗</a></p>`;
      if (ps.length > 1) h += `<div class="pgrid">${ps.map((x, i) => `<button type="button" class="pthumb" data-act="pick" data-i="${i}" aria-pressed="${i === dIdx}" aria-label="${i + 1}/${ps.length}"><img src="${esc(x.src)}" alt="" loading="lazy"></button>`).join('')}</div>`;
      if (canEdit) h += `<div class="ptools">${dIdx === 0 ? `<span class="ptag">${u('isCover')}</span>` : `<button type="button" data-act="setcover">${u('setCover')}</button>`}${cur.id ? `<button type="button" data-act="rmphoto">${u('removePhoto')}</button>` : ''}</div>`;
    } else {
      h += `<p class="pempty">${canEdit ? u('noPhotosEdit') : u('noPhotosView')}</p>`;
    }
    if (canEdit) {
      const c = (PH[p.key] && PH[p.key].cover) || 'auto';
      h += `<input type="file" class="vh" id="ph-input" accept="image/jpeg,image/png,image/webp,image/gif" multiple><label class="upl" for="ph-input">${u('addPhotos')}</label>`;
      if (ids.length) h += `<div class="sec"><b>${u('coverThis')}</b><div class="seg" role="group">${[['auto', u('auto')], ['art', u('coverArt')], ['photo', u('coverPhoto')]].map(([v, t]) => `<button type="button" data-act="pcover" data-v="${v}" aria-pressed="${c === v}">${t}</button>`).join('')}</div></div>`;
    }
    if (phMsg) h += `<p class="pmsg" role="status">${phMsg}</p>`;
    if (p.vol > 1) h += `<a class="weblink" href="${webUrl(p)}" target="_blank" rel="noopener noreferrer">${u('web')}</a>`;
    return h;
  }
  function renderDetail(k) {
    const p = BY[k]; if (openKey !== k) { dIdx = 0; phMsg = ''; } openKey = k;
    const seq = seqFor(k), i = seq.indexOf(k);
    const prev = i > 0 ? seq[i - 1] : null, next = i >= 0 && i < seq.length - 1 ? seq[i + 1] : null;
    const n = photosOf(k).length;
    const lab = p.vol === 1 ? [u('how'), u('arch')] : p.vol === 2 ? [u('how'), u('design')] : [u('about'), u('airIn')];
    const rels = p.vol === 1 ? relSection(u('applied'), DERIVED[k] || []) :
      p.vol === 2 ? relSection(u('fromv'), origins(p)) + relSection(u('refs'), DERIVED[k] || []) : relSection(u('related'), origins(p));
    dlg.innerHTML = `
      <div class="dlg-bar"><span>${u('plate')} ${p.num} · ${pick(DOM[p.dom])}</span>
        <span class="nav">
          <button type="button" data-act="open" data-k="${prev || ''}"${prev ? '' : ' disabled'}>${u('prev')}</button>
          <button type="button" data-act="open" data-k="${next || ''}"${next ? '' : ' disabled'}>${u('next')}</button>
          <button type="button" data-act="close">${u('close')} ✕</button>
        </span></div>
      <div class="dlg-body">
        <div class="dlg-fig art">
          <div class="seg tabs" role="tablist"><button type="button" role="tab" data-act="tab" data-tab="art" aria-selected="${dTab === 'art'}" aria-pressed="${dTab === 'art'}">${u('illus')}</button><button type="button" role="tab" data-act="tab" data-tab="photos" aria-selected="${dTab === 'photos'}" aria-pressed="${dTab === 'photos'}">${u('photos')}${n ? ` · ${n}` : ''}</button></div>
          ${dTab === 'art' ? `<figure style="padding:0">${svgFor(p)}</figure>` : photoPane(p)}
          <div class="datum" data-label="${dataLabel(p)}">${tx(p, 5)}</div>
        </div>
        <div class="dlg-text">
          <h2 id="dlg-title">${tx(p, 0)}</h2>
          <p class="trait"><b>${u('trait')}</b>${tx(p, 1)}</p>
          <p class="desc" style="font-size:15px">${tx(p, 2)}</p>
          <div class="sec"><b>${lab[0]}</b><p>${tx(p, 3)}</p></div>
          <div class="sec"><b>${lab[1]}</b><p>${tx(p, 4)}</p></div>
          ${rels}
          <div class="acts">${saveBtn(k)}</div>
        </div>
      </div>`;
  }
  function openDetail(k, tab) { if (!k || !BY[k]) return; if (tab) dTab = tab; else if (openKey !== k && !dlg.open) dTab = 'art'; renderDetail(k); if (!dlg.open) dlg.showModal(); }

  function goTo(k) {
    const p = BY[k]; if (!p) return;
    if (dlg.open) dlg.close();
    view = 'v' + p.vol; filter = 'all'; render();
    const el = $('p-' + k); if (!el) return;
    el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
    el.focus({ preventScroll: true });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }

  /* photo upload / edit */
  async function prepImage(file) {
    try {
      if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) throw 0;
      if (file.type === 'image/gif') return { blob: file, type: file.type };
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      if (s === 1 && file.size < 2.5e6) return { blob: file, type: file.type };
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .86));
      return blob ? { blob, type: 'image/jpeg' } : { blob: file, type: file.type };
    } catch (e) { return { blob: file, type: file.type || 'application/octet-stream' }; }
  }
  async function uploadFiles(k, files) {
    if (!assetsNS || !files.length) return;
    phMsg = u('uploading')(files.length); renderDetail(k);
    const added = []; let err = null;
    for (const f of files) {
      try { const { blob, type } = await prepImage(f); const r = await assetsNS.upload(blob, { type }); if (r && okId(r.id)) added.push(r.id); }
      catch (e) { err = e && e.code; if (err === 'rate_limited' || err === 'quota_or_state') break; }
    }
    if (added.length) {
      const cur = PH[k] || { ids: [], cover: null };
      try { const before = photosOf(k).length; await writePhotos(k, { ids: cur.ids.concat(added), cover: cur.cover, first: cur.first }); phMsg = err ? u('upErr')(err) : u('uploaded'); dIdx = before; }
      catch (e) { phMsg = u('upErr')('state'); }
    } else phMsg = u('upErr')(err);
    if (openKey === k) renderDetail(k);
    refreshPhotos();
  }

  /* ───────── events ───────── */
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) { if (e.target === dlg) dlg.close(); return; }
    if (b.dataset.lang) { if (b.dataset.lang !== L) { L = b.dataset.lang; try { localStorage.setItem('air-lang', L); } catch (er) {} render(); } return; }
    if (b.dataset.view && (!b.dataset.act || b.dataset.act === 'view')) { if (b.dataset.view !== view) { view = b.dataset.view; filter = 'all'; render(); window.scrollTo({ top: 0 }); } return; }
    if (b.dataset.sort) { sort3 = b.dataset.sort; nav.querySelectorAll('[data-sort]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderGallery(); main.querySelectorAll('.plate').forEach(el => el.hidden = !(filter === 'all' || el.dataset.dom === filter)); return; }
    if (b.dataset.cover) { coverMode = b.dataset.cover; try { localStorage.setItem('air-cover', coverMode); } catch (er) {} nav.querySelectorAll('[data-cover]').forEach(x => x.setAttribute('aria-pressed', x === b)); refreshPhotos(); return; }
    if (b.dataset.dom && b.closest('#filters')) { filter = b.dataset.dom; nav.querySelectorAll('[data-dom]').forEach(x => x.setAttribute('aria-pressed', x === b)); main.querySelectorAll('.plate').forEach(el => el.hidden = !(filter === 'all' || el.dataset.dom === filter)); setFoot(); return; }
    const act = b.dataset.act, k = b.dataset.k;
    if (act === 'open') openDetail(k);
    else if (act === 'photos') openDetail(k, 'photos');
    else if (act === 'save') toggleSave(k);
    else if (act === 'close') dlg.close();
    else if (act === 'go') goTo(k);
    else if (act === 'tab') { dTab = b.dataset.tab; renderDetail(openKey); }
    else if (act === 'pick') { dIdx = +b.dataset.i; renderDetail(openKey); }
    else if (act === 'setcover' && openKey) { const item = photosOf(openKey)[dIdx]; if (!item) return; const c = PH[openKey] || { ids: [], cover: null }; dIdx = 0; writePhotos(openKey, { ids: c.ids, cover: c.cover, first: item.src }).catch(() => { phMsg = u('upErr')('state'); }); refreshPhotos(); }
    else if (act === 'rmphoto' && openKey) {
      const item = photosOf(openKey)[dIdx], c = PH[openKey]; if (!item || !item.id || !c) return;
      const id = item.id, ids = c.ids.filter(x => x !== id), kk = openKey;
      dIdx = Math.max(0, dIdx - 1);
      writePhotos(kk, { ids, cover: c.cover, first: c.first === item.src ? null : c.first }).then(() => { phMsg = u('removed'); if (assetsNS) assetsNS.delete(id).catch(() => {}); refreshPhotos(); }).catch(() => { phMsg = u('upErr')('state'); refreshPhotos(); });
      refreshPhotos();
    }
    else if (act === 'pcover' && openKey) { const c = PH[openKey] || { ids: [], cover: null, first: null }; writePhotos(openKey, { ids: c.ids, cover: b.dataset.v === 'auto' ? null : b.dataset.v, first: c.first }).catch(() => {}); refreshPhotos(); }
    else if (act === 'mv') {
      const i = items.findIndex(x => x.k === k), j = i + (+b.dataset.d);
      if (i < 0 || j < 0 || j >= items.length) return;
      [items[i], items[j]] = [items[j], items[i]]; persist(); renderMural();
      const nb = main.querySelector(`[data-act="mv"][data-k="${k}"][data-d="${b.dataset.d}"]`); if (nb && !nb.disabled) nb.focus();
    }
  });
  dlg.addEventListener('change', e => { if (e.target.id === 'ph-input' && openKey) { uploadFiles(openKey, Array.from(e.target.files || [])); e.target.value = ''; } });
  main.addEventListener('input', e => {
    const ta = e.target.closest('textarea[data-k]'); if (!ta) return;
    const it = items.find(x => x.k === ta.dataset.k); if (!it) return;
    it.note = ta.value; persistSoon();
  });
  main.addEventListener('focusout', e => { if (e.target.matches('textarea[data-k]')) { clearTimeout(noteTimer); persist(); } });
  dlg.addEventListener('close', () => { openKey = null; phMsg = ''; });
  // a photo that fails to load falls back to the illustration
  document.addEventListener('error', e => {
    const t = e.target; if (!t || t.tagName !== 'IMG') return;
    if (t.classList.contains('ph-cover')) { const p = BY[t.dataset.k]; const fig = t.closest('figure'); if (p && fig) { fig.classList.remove('has-photo'); fig.innerHTML = svgFor(p); } }
    else if (t.classList.contains('ph-big')) { t.replaceWith(Object.assign(document.createElement('p'), { className: 'pempty', textContent: u('noPhotosView') })); }
  }, true);

  const h = (location.hash || '').toLowerCase();
  if (h === '#volume-2' || h === '#vol2') view = 'v2'; else if (h === '#volume-3' || h === '#vol3') view = 'v3'; else if (h === '#mural' || h === '#board') view = 'mural';
  render();
  connect();
})();
</script>


</body>
