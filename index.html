    ["Ventilated hive", "Bees that air-condition their home", "Workers line up at the entrance and beat their wings in sync, creating a current that renews the air, removes heat and evaporates water from nectar.", "On hot days other bees spread water droplets over the comb and the airflow evaporates them, cooling the hive. In the cold they cluster and shiver their muscles to make heat.", "A collective, distributed climate system: many small coordinated fans instead of one large machine.", "Brood nest kept near 35 °C"]);
  P(1, 'fau', 'ecolocalizacao',
    ["Ecolocalização", "Ver com o som que atravessa o ar", "Morcegos emitem chamados de ultrassom e escutam os ecos que voltam. O tempo e a mudança do eco revelam a distância, o tamanho e o movimento de um inseto no escuro.", "Frequências altas dão mais detalhe, mas se perdem mais rápido no ar, sobretudo em ar úmido. Cada espécie ajusta o chamado ao ambiente onde caça.", "O ar como meio de informação: a forma e os materiais de um espaço mudam como o som se reflete, algo que pessoas cegas também usam para se orientar.", "Morcegos usam ~20–200 kHz"],
    ["Echolocation", "Seeing with sound that crosses the air", "Bats emit ultrasonic calls and listen to the returning echoes. The timing and change of the echo reveal an insect’s distance, size and movement in the dark.", "Higher frequencies give more detail but fade faster in air, especially humid air. Each species tunes its call to the place it hunts.", "Air as a medium of information: a space’s shape and materials change how sound reflects, something blind people also use to find their way.", "Bats use ~20–200 kHz"]);
  P(1, 'flo', 'polinizacao',
    ["Anemofilia", "Polinização pelo vento", "Gramíneas, pinheiros e o milho confiam o pólen ao vento. Produzem grãos leves e lisos em quantidade enorme, e flores com estigmas plumosos que capturam o pólen do ar.", "Sem precisar atrair insetos, essas flores costumam ser discretas, sem pétalas vistosas nem perfume. A maior parte do pólen se perde, por isso a produção é tão grande.", "É a origem de boa parte das alergias respiratórias sazonais; filtros nas tomadas de ar e a escolha de espécies no paisagismo levam isso em conta.", "Um pé de milho libera milhões de grãos de pólen"],
    ["Anemophily", "Pollination by wind", "Grasses, pines and maize entrust their pollen to the wind. They make huge amounts of light, smooth grains, and flowers with feathery stigmas that catch pollen from the air.", "With no insects to attract, these flowers tend to be plain, without showy petals or scent. Most pollen is lost, which is why production is so large.", "It causes much of seasonal hay fever; intake filters and species choice in landscaping take it into account.", "A single maize plant releases millions of pollen grains"]);
  P(1, 'flo', 'cam',
    ["Metabolismo CAM", "Plantas que respiram à noite", "Cactos, agaves e abacaxis abrem os estômatos à noite, quando o ar é mais fresco e úmido, e guardam o CO₂ como ácido. De dia fecham os poros e usam esse estoque para a fotossíntese.", "Trocar gases à noite reduz muito a perda de água, o que permite viver em desertos. O custo é crescer mais devagar.", "Uma estratégia de defasagem: captar o ar quando ele é favorável e usar o recurso depois, como a ventilação noturna faz com o frescor.", "O CO₂ fica guardado como ácido málico até o dia"],
    ["CAM metabolism", "Plants that breathe at night", "Cacti, agaves and pineapples open their stomata at night, when air is cooler and damper, and store CO₂ as acid. By day they close their pores and draw on that store for photosynthesis.", "Exchanging gas at night greatly cuts water loss, allowing life in deserts. The cost is slower growth.", "A time-shifting strategy: take in air when it is favourable and use the resource later, as night ventilation does with coolness.", "CO₂ is stored as malic acid until daytime"]);

  P(1, 'tec', 'vela',
    ["Vela", "Um tecido que transforma vento em movimento", "A vela não é só empurrada: curvada, funciona como uma asa vertical e gera força lateral. Com quilha e leme, o barco converte essa força em avanço, inclusive contra o vento.", "Navegar contra o vento exige ziguezaguear em bordos. Velas modernas são desenhadas com o mesmo cálculo aerodinâmico das asas de avião.", "Coberturas tensionadas e toldos herdaram da vela a técnica de tecido, cabos e mastros, e o mesmo cuidado com as forças do vento.", "Veleiros avançam a ~45° do vento"],
    ["Sail", "Fabric that turns wind into motion", "A sail is not only pushed: curved, it works as a vertical wing and produces sideways force. With keel and rudder, the boat turns that force into forward motion, even against the wind.", "Sailing upwind means zigzagging in tacks. Modern sails are designed with the same aerodynamics as aircraft wings.", "Tensioned roofs and awnings inherited the sail’s technique of fabric, cables and masts, and the same care with wind forces.", "Sailboats can make way at ~45° to the wind"]);
  P(1, 'tec', 'moinho',
    ["Moinho de vento", "Pás que extraem energia do ar", "As pás desviam o ar e giram um eixo que mói grãos, bombeia água ou gera eletricidade. Os primeiros moinhos conhecidos, de eixo vertical, surgiram na Pérsia.", "Nenhum rotor extrai toda a energia do vento: se parasse o ar por completo, o ar novo não conseguiria passar. O limite teórico foi calculado por Albert Betz em 1919.", "Turbinas integradas a edifícios, como no Bahrain World Trade Center (2008), usam a forma das torres para acelerar o vento entre elas.", "Limite de Betz: no máximo 59,3% da energia do vento"],
    ["Windmill", "Blades that draw energy from the air", "The blades deflect air and turn a shaft that grinds grain, pumps water or generates electricity. The earliest known windmills, with a vertical axis, appeared in Persia.", "No rotor can extract all the wind’s energy: if it stopped the air completely, new air could not pass through. The theoretical limit was worked out by Albert Betz in 1919.", "Building-integrated turbines, as at the Bahrain World Trade Center (2008), use the shape of the towers to speed up wind between them.", "Betz limit: at most 59.3% of the wind’s energy"]);
  P(1, 'tec', 'pipa',
    ["Pipa", "Uma asa presa à terra por um fio", "A pipa fica no ar porque a linha a mantém inclinada contra o vento, gerando sustentação. A rabiola estabiliza o voo, aumentando o arrasto na parte de trás.", "Pipas foram usadas para sinalização, meteorologia e experimentos científicos; Benjamin Franklin estudou a eletricidade dos raios com uma em 1752.", "Estruturas leves ancoradas por cabos, como coberturas suspensas e pipas que geram energia, exploram a mesma relação entre forma, tração e vento.", "Origem na China há mais de 2 mil anos"],
    ["Kite", "A wing tied to the ground by a line", "A kite stays up because the line holds it tilted into the wind, producing lift. The tail stabilises flight by adding drag at the back.", "Kites have been used for signalling, meteorology and science; Benjamin Franklin studied lightning’s electricity with one in 1752.", "Light structures anchored by cables, such as suspended roofs and energy-generating kites, exploit the same relation between form, tension and wind.", "Originated in China more than 2,000 years ago"]);
  P(1, 'tec', 'flauta',
    ["Flauta", "Uma coluna de ar que canta", "O sopro bate numa aresta e oscila entre os dois lados dela. Essa oscilação faz vibrar o ar dentro do tubo, e o comprimento da coluna de ar define a nota.", "Abrir furos encurta a coluna de ar que vibra e eleva o som. O próprio instrumento não vibra muito: quem soa é o ar dentro dele.", "Tubos e cavidades de um edifício também ressoam com o vento: dutos que assobiam e fachadas que zumbem são problemas que o projeto precisa prever.", "f = v / 2L (tubo aberto)"],
    ["Flute", "A column of air that sings", "The breath strikes an edge and flips from one side of it to the other. That oscillation sets the air inside the tube vibrating, and the length of the air column sets the note.", "Opening holes shortens the vibrating air column and raises the pitch. The instrument itself barely vibrates: what sounds is the air inside it.", "A building’s ducts and cavities also resonate with wind: whistling ducts and humming façades are problems design must anticipate.", "f = v / 2L (open pipe)"]);
  P(1, 'tec', 'fole',
    ["Fole", "Empurrar ar para avivar o fogo", "O fole aspira ar ao abrir e o expulsa por um bico ao fechar. Soprado sobre o carvão, o ar extra fornece mais oxigênio e a brasa atinge temperaturas capazes de amolecer o ferro.", "Foles movidos a água ou a mão permitiram a metalurgia do ferro e, mais tarde, os altos-fornos. Também alimentam órgãos de tubos e acordeões.", "Insuflar ar de forma controlada é a base dos sistemas mecânicos de ventilação: o ventilador é o fole moderno.", "Forjas ultrapassam 1.200 °C com ar insuflado"],
    ["Bellows", "Pushing air to stoke a fire", "Bellows draw air in as they open and drive it out through a nozzle as they close. Blown onto charcoal, the extra air supplies more oxygen and the fire reaches temperatures that soften iron.", "Water- or hand-powered bellows made iron metallurgy possible and, later, blast furnaces. They also feed pipe organs and accordions.", "Controlled supply of air is the basis of mechanical ventilation: the fan is the modern bellows.", "Forges exceed 1,200 °C with forced air"]);

  /* Volume II */
  P(2, 'ven', 'cruzada',
    ["Ventilação cruzada", "Aberturas opostas aproveitam a pressão do vento", "O vento cria pressão positiva na fachada que o recebe e negativa na oposta. Com janelas nos dois lados e planta pouco profunda, o ar atravessa o ambiente sem ajuda mecânica.", "Uma janela de saída igual ou maior que a de entrada favorece o fluxo. Divisórias, portas fechadas e móveis altos no caminho reduzem muito o efeito.", "Plantas estreitas, aberturas em fachadas opostas e bandeiras sobre portas internas mantêm o caminho do ar aberto.", "Eficaz até ~5 vezes o pé-direito de profundidade"],
    ["Cross ventilation", "Opposite openings harness wind pressure", "Wind creates positive pressure on the façade it strikes and negative pressure on the opposite one. With windows on both sides and a shallow plan, air crosses the room without mechanical help.", "An outlet as large as or larger than the inlet helps the flow. Partitions, closed doors and tall furniture in the path greatly reduce the effect.", "Narrow plans, openings on opposite façades and transoms over internal doors keep the air path open.", "Effective up to ~5× the ceiling height in depth"], 'vento');
  P(2, 'ven', 'pilotis',
    ["Pilotis", "Deixar o vento passar sob o edifício", "Erguer o edifício sobre pilares libera o térreo para o vento e para as pessoas. O ar circula sob o volume, ventila o piso e chega aos edifícios que estão atrás dele.", "Le Corbusier fez do pilotis um dos cinco pontos da arquitetura moderna. No Brasil ele ganhou papel climático em obras como o Ministério da Educação e Saúde, no Rio.", "Térreos permeáveis evitam que um edifício bloqueie a ventilação da quadra e criam uma sombra ventilada de uso público.", "Palácio Gustavo Capanema, Rio (1936–1945)"],
    ["Pilotis", "Letting the wind pass beneath the building", "Raising a building on columns frees the ground floor for wind and people. Air flows under the volume, ventilates the floor slab and reaches the buildings behind it.", "Le Corbusier made pilotis one of his five points of modern architecture. In Brazil they took on a climatic role in works such as the Ministry of Education and Health in Rio.", "Permeable ground floors keep a building from blocking its block’s ventilation and create ventilated public shade.", "Gustavo Capanema Palace, Rio (1936–1945)"], 'vento');
  P(2, 'ven', 'chamineSolar',
    ["Chaminé solar", "O sol como motor da ventilação", "Uma torre envidraçada com superfície escura aquece o ar dentro dela. Esse ar sobe e sai pelo topo, puxando o ar dos ambientes e renovando-os mesmo em dias sem vento.", "Uma face envidraçada voltada ao sol e uma parede escura de massa térmica aquecem o ar da torre; a massa continua aquecendo depois que o sol se põe.", "Quanto mais alta a torre e mais quente o ar dentro dela, maior a vazão. As saídas devem ficar acima da cobertura e protegidas da chuva.", "Ex.: BRE Environmental Building, Garston (1997)"],
    ["Solar chimney", "The sun as ventilation engine", "A glazed tower with a dark surface heats the air inside it. That air rises and leaves at the top, drawing air from the rooms and renewing it even on still days.", "A sun-facing glazed side and a dark thermal-mass wall heat the stack air; the mass keeps heating after sunset.", "The taller the stack and the warmer its air, the greater the flow. Outlets should sit above the roof and be protected from rain.", "E.g. BRE Environmental Building, Garston (1997)"], 'chamine');
  P(2, 'ven', 'badgir',
    ["Torre de vento", "Captar o vento acima dos telhados", "O badgir persa capta o vento no alto, onde é mais forte e limpo, e o conduz para baixo; o outro lado da torre exaure o ar quente. Combinado à água ou ao subsolo, o ar chega resfriado.", "Em Yazd as torres têm aberturas em várias direções para captar ventos variáveis. Algumas levam o ar sobre um qanat, canal de água subterrâneo, onde ele esfria por evaporação.", "Torres altas captam ar mais rápido e limpo. Divisórias internas separam captação e exaustão; água ou massa térmica na base resfriam o ar que desce.", "Torre do Jardim Dowlatabad, Yazd: ~33 m"],
    ["Windcatcher", "Catching the wind above the rooftops", "The Persian badgir catches wind high up, where it is stronger and cleaner, and channels it down; the other side of the tower exhausts warm air. Combined with water or the ground, the air arrives cooled.", "In Yazd the towers open in several directions to catch shifting winds. Some route air over a qanat, an underground water channel, where it cools by evaporation.", "Tall towers catch faster, cleaner air. Internal partitions separate intake from exhaust; water or thermal mass at the base cools the descending air.", "Dowlatabad Garden tower, Yazd: ~33 m"], 'vento');
  P(2, 'ven', 'atrio',
    ["Átrio ventilado", "Um vazio que funciona como pulmão", "O vazio central atravessa os pavimentos e acumula o ar aquecido no topo, onde aberturas o liberam. Cada andar recebe ar novo pela fachada e o exaure pelo átrio.", "O átrio também leva luz natural ao centro de plantas profundas. Fechado no inverno, funciona como estufa e espaço intermediário.", "As aberturas do topo devem ficar acima do último pavimento ocupado, para que o ar quente estratifique fora da zona de uso.", "Efeito chaminé na escala do edifício"],
    ["Ventilated atrium", "A void that works as a lung", "The central void runs through the floors and collects warm air at the top, where openings release it. Each floor takes fresh air from the façade and exhausts it into the atrium.", "The atrium also brings daylight into the centre of deep plans. Closed in winter, it acts as a greenhouse and buffer space.", "Top openings should sit above the highest occupied floor, so warm air stratifies outside the occupied zone.", "Stack effect at building scale"], 'chamine');
  P(2, 'ven', 'poco',
    ["Poço canadense", "O solo como trocador de calor", "O ar externo entra por tubos enterrados antes de chegar ao edifício. A poucos metros de profundidade o solo quase não varia de temperatura, então o ar chega mais fresco no verão e mais morno no inverno.", "A cerca de dois metros de profundidade, o solo fica perto da temperatura média anual do lugar. Tubos mais longos aumentam a troca de calor.", "Tubos de 30 a 50 m, com leve inclinação para drenar a condensação e filtro na tomada de ar, evitam problemas de umidade e higiene.", "Também chamado de poço provençal"],
    ["Earth-air tube", "The ground as heat exchanger", "Outdoor air passes through buried pipes before reaching the building. A few metres down the soil barely changes temperature, so the air arrives cooler in summer and warmer in winter.", "At about two metres deep, soil stays close to the site’s annual mean temperature. Longer pipes increase heat exchange.", "Pipes 30 to 50 m long, sloped to drain condensation and with a filter at the intake, avoid damp and hygiene problems.", "Also called a Canadian or Provençal well"], 'isolamento');

  P(2, 'env', 'muxarabi',
    ["Muxarabi", "Treliça que filtra luz, vento e olhar", "A tela de madeira torneada sombreia a janela, mantém a privacidade e deixa o ar passar. Em versões tradicionais, jarros de água junto à treliça resfriam a brisa que entra.", "Os furos menores no alto e maiores embaixo equilibram luz e privacidade. A madeira absorve umidade à noite e a libera de dia, ajudando a resfriar.", "Uma tela à frente da janela, afastada da fachada, sombreia sem bloquear o vento. A densidade da trama controla quanta luz e quanta vista passam.", "Tradicional no Cairo e no mundo árabe"],
    ["Mashrabiya", "A lattice filtering light, wind and gaze", "The turned-wood screen shades the window, keeps privacy and lets air through. In traditional versions, water jars set by the lattice cool the incoming breeze.", "Smaller openings at the top and larger ones below balance light and privacy. The timber absorbs moisture at night and releases it by day, helping to cool.", "A screen held in front of the window, away from the façade, shades without blocking the wind. The density of the lattice sets how much light and view pass.", "Traditional in Cairo and across the Arab world"], 'evaporativo');
  P(2, 'env', 'cobogo',
    ["Cobogó", "Parede que respira", "O bloco vazado brasileiro deixa a fachada permeável ao vento e à luz difusa, mantendo sombra e privacidade. Tornou-se marca da arquitetura moderna tropical.", "Nas décadas de 1940 e 50, arquitetos como Lucio Costa usaram o cobogó em grandes fachadas, como nos edifícios do Parque Guinle, no Rio.", "Funciona melhor em fachadas sombreadas ou com beiral, combinado a aberturas opostas que deixem o ar atravessar.", "Patenteado em Recife (1929) por Coimbra, Boeckmann e Góis"],
    ["Cobogó", "A wall that breathes", "The Brazilian breeze block makes a façade permeable to wind and diffuse light while keeping shade and privacy. It became a hallmark of tropical modern architecture.", "In the 1940s and 50s architects such as Lucio Costa used cobogós across whole façades, as in the Parque Guinle buildings in Rio.", "It works best on shaded façades or under eaves, combined with opposite openings that let air cross.", "Patented in Recife (1929) by Coimbra, Boeckmann and Góis"], 'vento');
  P(2, 'env', 'brise',
    ["Brise-soleil", "Sombra que deixa o ar passar", "Lâminas fixas ou móveis barram o sol antes que ele atinja o vidro, sem fechar a fachada ao vento. Ficaram associadas à arquitetura moderna brasileira.", "Barrar o sol do lado de fora é muito mais eficaz que cortinas internas, porque o calor nem chega a entrar. O ar circula entre as lâminas e leva o calor que elas absorvem.", "Lâminas horizontais funcionam para o sol alto; verticais, para o sol baixo do nascente e do poente. Afastá-las da fachada evita que o ar quente fique preso.", "Ex.: brises móveis do Palácio Gustavo Capanema"],
    ["Brise-soleil", "Shade that lets air through", "Fixed or movable louvres stop the sun before it reaches the glass, without closing the façade to the wind. They became associated with Brazilian modern architecture.", "Stopping sun outside is far more effective than internal blinds, because the heat never gets in. Air flows between the louvres and carries off the heat they absorb.", "Horizontal louvres suit high sun; vertical ones suit low morning and evening sun. Holding them away from the façade keeps hot air from being trapped.", "E.g. the movable louvres of the Gustavo Capanema Palace"], 'conveccao');
  P(2, 'env', 'fachadaDupla',
    ["Fachada dupla ventilada", "Duas peles com ar entre elas", "Uma segunda pele de vidro cria uma cavidade onde o ar sobe aquecido e leva embora o calor do sol, protegendo as persianas do vento. No inverno, a cavidade fechada vira câmara isolante.", "A cavidade pode ser contínua em toda a altura ou dividida por andar. Mal projetada, vira estufa e superaquece.", "Persianas dentro da cavidade, aberturas controláveis no topo e na base e um estudo de sobreaquecimento são essenciais.", "Ex.: Commerzbank Tower, Frankfurt (1997)"],
    ["Ventilated double-skin façade", "Two skins with air between them", "A second glass skin creates a cavity where heated air rises and carries solar heat away, while shielding blinds from the wind. In winter the closed cavity becomes an insulating buffer.", "The cavity can run the full height or be divided floor by floor. Poorly designed, it becomes a greenhouse and overheats.", "Blinds inside the cavity, controllable openings at top and bottom and an overheating study are essential.", "E.g. Commerzbank Tower, Frankfurt (1997)"], 'chamine');
  P(2, 'env', 'telhado',
    ["Telhado ventilado", "Uma câmara de ar sob as telhas", "O espaço entre cobertura e forro deixa o ar entrar pelos beirais e sair pela cumeeira. O calor que atravessa as telhas é levado embora antes de chegar aos ambientes.", "Em climas quentes a câmara reduz bastante o calor que chega ao forro. Em climas frios ela também retira umidade e evita condensação.", "Garanta entrada contínua de ar no beiral, saída na cumeeira e uma câmara sem obstruções; telas impedem a entrada de insetos.", "Entrada no beiral, saída na cumeeira"],
    ["Ventilated roof", "An air cavity under the tiles", "The space between roofing and ceiling lets air in at the eaves and out at the ridge. Heat passing through the tiles is carried off before it reaches the rooms.", "In hot climates the cavity greatly cuts the heat reaching the ceiling. In cold climates it also removes moisture and prevents condensation.", "Provide a continuous inlet at the eaves, an outlet at the ridge and an unobstructed cavity; mesh keeps insects out.", "Inlet at the eaves, outlet at the ridge"], 'conveccao');

  P(2, 'res', 'patio',
    ["Pátio", "Um reservatório de ar fresco no centro da casa", "O pátio fechado retém o ar frio da noite, mais pesado, e a sombra das paredes o protege do sol. Durante o dia, os cômodos ao redor respiram esse ar.", "Água, vegetação e piso sombreado prolongam o efeito. A proporção entre a altura das paredes e a largura do pátio define quanto sol chega ao chão.", "Pátios estreitos e altos sombreiam mais em climas quentes e secos; em climas úmidos, aberturas para ventilação cruzada pesam mais.", "Tradição mediterrânea, árabe e da casa colonial brasileira"],
    ["Courtyard", "A reservoir of cool air at the heart of the house", "An enclosed courtyard holds the heavier cool night air, and the shade of its walls protects it from the sun. During the day the surrounding rooms breathe this air.", "Water, planting and shaded paving extend the effect. The ratio between wall height and courtyard width sets how much sun reaches the floor.", "Narrow, tall courtyards shade more in hot dry climates; in humid climates, openings for cross ventilation matter more.", "A Mediterranean, Arab and Brazilian colonial tradition"], 'empuxo');
  P(2, 'res', 'yakhchal',
    ["Yakhchal", "Uma geladeira de terra e ar", "As casas de gelo persas guardavam gelo feito no inverno sob uma cúpula espessa de barro. O poço subterrâneo, a massa da cúpula e torres de vento mantinham o frio no deserto até o verão.", "No inverno a água era levada a tanques rasos sombreados por muros altos, onde congelava à noite. O gelo era guardado no poço, isolado com palha.", "Uma lição sobre combinar massa, sombra, profundidade e ventilação para guardar frio sem energia.", "Construções persas desde ~400 a.C."],
    ["Yakhchāl", "A refrigerator of earth and air", "Persian ice houses stored winter-made ice under a thick earthen dome. The underground pit, the mass of the dome and windcatchers kept the cold in the desert until summer.", "In winter, water was led into shallow pools shaded by tall walls, where it froze overnight. The ice was stored in the pit, insulated with straw.", "A lesson in combining mass, shade, depth and ventilation to keep cold without energy.", "Persian structures dating to ~400 BC"], 'evaporativo');
  P(2, 'res', 'noturna',
    ["Ventilação noturna", "Lavar o calor do dia com o ar da noite", "Lajes e paredes pesadas absorvem calor durante o dia. À noite, janelas abertas deixam o ar fresco atravessar o edifício e descarregar essa massa, que volta a absorver calor no dia seguinte.", "A estratégia depende de massa térmica exposta: lajes sem forro, paredes de pedra ou concreto. Forros e carpetes isolam a massa e reduzem o efeito.", "Aberturas seguras para ficar abertas à noite, massa exposta e proteção solar durante o dia são as três condições básicas.", "Rende mais com amplitude diária acima de ~10 °C"],
    ["Night ventilation", "Flushing the day’s heat with night air", "Heavy slabs and walls absorb heat during the day. At night, open windows let cool air cross the building and discharge that mass, ready to absorb heat again the next day.", "The strategy depends on exposed thermal mass: unclad slabs, stone or concrete walls. Suspended ceilings and carpets insulate the mass and weaken the effect.", "Openings that are safe to leave open at night, exposed mass and daytime solar protection are the three basic conditions.", "Works best with a daily swing above ~10 °C"], 'conveccao');
  P(2, 'res', 'eastgate',
    ["Eastgate Centre", "Um edifício que copia o cupinzeiro", "Ventiladores de baixa potência empurram o ar noturno através das lajes ocas, e chaminés no telhado exaurem o ar aquecido do dia. Dispensa ar-condicionado convencional no clima de Harare.", "O edifício combina massa de concreto, lajes com dutos, sombreamento profundo e chaminés. Consome uma fração da energia de um prédio climatizado equivalente.", "Mostra que a biomimética funciona melhor como princípio do que como cópia de forma: o que se transfere é o ciclo diário de calor e ar.", "Mick Pearce · Harare, Zimbábue (1996)"],
    ["Eastgate Centre", "A building that copies the termite mound", "Low-power fans push night air through hollow floor slabs, and roof chimneys exhaust the day’s warm air. It does without conventional air conditioning in Harare’s climate.", "The building combines concrete mass, ducted slabs, deep shading and chimneys. It uses a fraction of the energy of an equivalent air-conditioned building.", "It shows that biomimicry works better as a principle than as a copied form: what transfers is the daily cycle of heat and air.", "Mick Pearce · Harare, Zimbabwe (1996)"], 'cupinzeiro');

  P(2, 'est', 'pneumatica',
    ["Estrutura pneumática", "O ar como elemento portante", "Membranas mantidas por uma pequena diferença de pressão vencem grandes vãos com quase nenhum material. O ar dentro de tubos ou sob a cobertura faz o papel de pilares e vigas.", "A sobrepressão necessária costuma ser de algumas centenas de pascals, menos do que a variação sentida ao subir dez andares de elevador.", "Ancoragem contra o vento, portas com eclusa e ventiladores de reserva fazem parte do projeto. A forma segue a pressão: as superfícies tendem à curva.", "Ex.: Pavilhão Fuji, Expo ’70, Osaka"],
    ["Pneumatic structure", "Air as the load-bearing element", "Membranes held up by a small pressure difference span large distances with almost no material. Air inside tubes or under the roof does the work of columns and beams.", "The overpressure needed is usually a few hundred pascals, less than the change you feel riding a lift up ten floors.", "Wind anchorage, airlock doors and backup fans are part of the design. Form follows pressure: surfaces tend toward curves.", "E.g. Fuji Pavilion, Expo ’70, Osaka"], 'gases');
  P(2, 'est', 'etfe',
    ["Almofadas de ETFE", "Fechamento leve feito de ar pressurizado", "Camadas de filme plástico infladas formam almofadas que isolam pelo ar preso entre elas. Pesam uma fração do vidro e cobrem grandes áreas com estrutura mínima.", "As almofadas têm de duas a cinco camadas, mantidas infladas por bombas de baixa pressão. Camadas impressas ou móveis controlam a passagem de luz e calor.", "Exige redundância no sistema de ar e cuidado acústico: a membrana é ruidosa sob chuva.", "Ex.: Eden Project (2001), Allianz Arena (2005)"],
    ["ETFE cushions", "Light enclosure made of pressurised air", "Inflated layers of plastic film form cushions that insulate through the air trapped between them. They weigh a fraction of glass and cover large areas with minimal structure.", "Cushions have two to five layers kept inflated by low-pressure pumps. Printed or movable layers control light and heat gain.", "It needs redundancy in the air supply and acoustic care: the membrane is noisy in rain.", "E.g. Eden Project (2001), Allianz Arena (2005)"], 'isolamento');
  P(2, 'est', 'cortina',
    ["Cortina de ar", "Uma porta feita de vento", "Um jato contínuo soprado de cima para baixo separa dois climas numa abertura. Reduz a troca de calor, poeira e insetos sem impedir a passagem de pessoas.", "O jato precisa cobrir toda a largura e altura da abertura com velocidade suficiente para resistir ao vento e à diferença de temperatura.", "Funciona melhor em portas protegidas do vento direto e combinada a antecâmaras. Gasta energia o tempo todo, então complementa a porta, não a substitui.", "Comum em lojas, câmaras frias e hangares"],
    ["Air curtain", "A door made of wind", "A continuous jet blown downward separates two climates at an opening. It cuts heat exchange, dust and insects without stopping people passing.", "The jet must cover the full width and height of the opening with enough speed to resist wind and the temperature difference.", "It works best at doors sheltered from direct wind and combined with lobbies. It uses energy constantly, so it complements a door rather than replacing it.", "Common in shops, cold stores and hangars"], 'coanda');

  P(2, 'atm', 'blur',
    ["Blur Building", "Arquitetura feita de neblina", "Uma plataforma sobre o lago de Neuchâtel envolta por uma nuvem artificial produzida por bicos de alta pressão. O edifício não tem fachada: o visitante entra num clima.", "A névoa mudava de forma com o vento, a umidade e a temperatura, e um sistema meteorológico ajustava os bicos em tempo real.", "Uma referência de arquitetura sem matéria sólida: ar e água definem o espaço, a luz e a visibilidade.", "Diller + Scofidio · Expo.02, Yverdon-les-Bains"],
    ["Blur Building", "Architecture made of mist", "A platform on Lake Neuchâtel wrapped in an artificial cloud produced by high-pressure nozzles. The building has no façade: visitors walk into a climate.", "The fog changed shape with wind, humidity and temperature, and a weather system adjusted the nozzles in real time.", "A reference for architecture without solid matter: air and water define space, light and visibility.", "Diller + Scofidio · Expo.02, Yverdon-les-Bains"], 'orvalho');
  P(2, 'atm', 'taichung',
    ["Parque climático", "Projetar o ar de um espaço aberto", "Em Taichung, Taiwan, o parque foi desenhado a partir de mapas de calor, umidade e poluição. Dispositivos de névoa, sombra e ventilação criam percursos mais frescos, secos e limpos.", "Os mapas de simulação mostram onde o ar é mais quente, úmido ou poluído, e o desenho do parque responde com vegetação, água e dispositivos.", "Propõe projetar o clima como material, desenhando gradientes de temperatura e umidade em vez de apenas formas.", "Central Park de Taichung · Philippe Rahm"],
    ["Climatic park", "Designing the air of an open space", "In Taichung, Taiwan, the park was laid out from maps of heat, humidity and pollution. Mist, shade and ventilation devices create cooler, drier, cleaner routes.", "Simulation maps show where air is hotter, damper or more polluted, and the park’s design responds with planting, water and devices.", "It proposes designing climate as a material, drawing gradients of temperature and humidity rather than only forms.", "Taichung Central Park · Philippe Rahm"], 'evaporativo');

  P(2, 'ven', 'exaustor',
    ["Exaustor eólico", "O vento como motor da exaustão", "A turbina giratória no telhado é movida pelo vento. Ao girar, cria baixa pressão no topo e puxa o ar quente acumulado sob a cobertura, sem consumir eletricidade.", "Mesmo sem vento, o efeito chaminé faz o ar quente sair pela turbina, só que mais devagar. Várias unidades distribuídas renovam o ar de grandes galpões.", "Funciona melhor com entradas de ar baixas nas fachadas e no ponto mais alto da cobertura, onde o ar quente se acumula.", "Comum em galpões e fábricas no Brasil"],
    ["Wind-driven roof ventilator", "Wind as the exhaust engine", "The spinning turbine on the roof is turned by the wind. As it spins it creates low pressure at the top and draws out the warm air collected under the roof, using no electricity.", "Even without wind, the stack effect pushes warm air out through the turbine, only more slowly. Several distributed units renew the air of large sheds.", "It works best with low air inlets in the walls and placed at the highest point of the roof, where warm air collects.", "Common on sheds and factories in Brazil"], 'toca');
  P(2, 'ven', 'deslocamento',
    ["Ventilação por deslocamento", "Ar fresco que sobe com o calor das pessoas", "Ar levemente mais frio que o ambiente entra devagar junto ao piso e se espalha como um lago. Pessoas e equipamentos aquecem esse ar, que sobe em plumas e leva os poluentes para a exaustão no alto.", "Ao contrário da mistura, que dilui o ar viciado, o deslocamento empurra o ar velho para cima e mantém a zona de respiração mais limpa.", "Funciona bem em salas de pé-direito alto, como auditórios e salas de aula; as entradas precisam de baixa velocidade para não incomodar.", "Insuflação junto ao piso a ≤ 0,25 m/s"],
    ["Displacement ventilation", "Fresh air rising with people’s heat", "Air slightly cooler than the room enters slowly at floor level and spreads like a pool. People and equipment warm it, and it rises in plumes, carrying pollutants to exhausts up high.", "Unlike mixing, which dilutes stale air, displacement pushes old air upward and keeps the breathing zone cleaner.", "It works well in tall rooms such as auditoria and classrooms; inlets need low velocity to avoid drafts.", "Floor-level supply at ≤ 0.25 m/s"], 'empuxo');
  P(2, 'env', 'terraCrua',
    ["Terra crua", "Paredes que respiram umidade", "Taipa, adobe e reboco de argila absorvem e devolvem vapor, amortecendo a umidade interna. A grande massa das paredes também atrasa a passagem do calor do dia.", "A argila é dos materiais mais higroscópicos usados em construção. Uma parede espessa pode levar horas para transmitir o calor do sol para dentro.", "Combina bem com ventilação noturna em climas de dias quentes e noites frescas. Precisa de proteção contra chuva direta: beirais largos e base elevada.", "Taipa e adobe: tradição do Brasil colonial e de muitas culturas"],
    ["Raw earth", "Walls that breathe moisture", "Rammed earth, adobe and clay plaster absorb and return vapour, buffering indoor humidity. The walls’ great mass also delays the passage of the day’s heat.", "Clay is among the most hygroscopic building materials. A thick wall can take hours to carry the sun’s heat inside.", "It pairs well with night ventilation in climates with hot days and cool nights. It needs protection from driving rain: wide eaves and a raised base.", "Rammed earth and adobe: a tradition of colonial Brazil and many cultures"], 'higroscopia');
  P(2, 'res', 'tetoVerde',
    ["Teto verde", "Uma cobertura que transpira", "Solo e plantas sobre a laje sombreiam a cobertura, isolam e resfriam o ar por evapotranspiração. Também retêm água de chuva e reduzem o escoamento.", "O resfriamento depende de água disponível: um teto verde seco esquenta. A camada de solo acrescenta massa térmica e protege a impermeabilização.", "Exige laje dimensionada para o peso saturado, drenagem e espécies adaptadas ao sol e ao vento da cobertura.", "Ex.: jardim de Burle Marx no Palácio Gustavo Capanema"],
    ["Green roof", "A roof that transpires", "Soil and plants on the slab shade the roof, insulate it and cool the air by evapotranspiration. They also hold rainwater and reduce runoff.", "Cooling depends on available water: a dry green roof heats up. The soil layer adds thermal mass and protects the waterproofing.", "It needs a slab sized for saturated weight, drainage and species adapted to rooftop sun and wind.", "E.g. Burle Marx’s roof garden at the Gustavo Capanema Palace"], 'transpiracao');
  P(2, 'res', 'torreDescendente',
    ["Torre de resfriamento descendente", "Névoa que faz o ar cair", "No alto de uma torre, água pulverizada evapora e resfria o ar. Mais denso, esse ar desce sozinho pela torre e sai frio na base, sem ventiladores.", "É o resfriamento evaporativo combinado ao empuxo invertido: o ar frio cai assim como o quente sobe. Rende muito em climas quentes e secos.", "A altura da torre e a quantidade de água controlam a vazão. Em climas úmidos o efeito cai bastante.", "Ex.: Centro de Visitantes do Parque Zion, EUA (2000)"],
    ["Passive downdraft cooling tower", "Mist that makes air fall", "At the top of a tower, sprayed water evaporates and cools the air. Denser, that air sinks down the tower on its own and leaves cool at the base, with no fans.", "It is evaporative cooling combined with reverse buoyancy: cool air falls just as warm air rises. It performs strongly in hot, dry climates.", "Tower height and water flow control the airflow. In humid climates the effect drops sharply.", "E.g. Zion National Park Visitor Center, USA (2000)"], 'evaporativo');
  P(2, 'atm', 'quebraVento',
    ["Quebra-vento", "Desenhar a sombra do vento", "Fileiras de árvores, muros vazados ou cercas reduzem a velocidade do vento atrás delas. Barreiras porosas funcionam melhor que as fechadas, que geram turbulência.", "A zona protegida se estende por várias vezes a altura da barreira. Uma porosidade de cerca de metade costuma dar a proteção mais longa.", "Protege pátios, praças e entradas do vento frio ou carregado de poeira, e pode ser posicionado para não bloquear a brisa desejada.", "Proteção até ~10–20 vezes a altura da barreira"],
    ["Windbreak", "Designing the wind’s shadow", "Rows of trees, perforated walls or fences slow the wind behind them. Porous barriers work better than solid ones, which create turbulence.", "The sheltered zone stretches several times the barrier’s height. A porosity of about half usually gives the longest shelter.", "It protects courtyards, squares and entrances from cold or dusty wind, and can be placed so as not to block a wanted breeze.", "Shelter up to ~10–20 times the barrier height"], 'vento');

      `<line x1="10" y1="150" x2="230" y2="150"/><path d="M30 150 V60 L170 22 V150"/><path class="dash" d="M150 30 V20 H176 V28"/>` +
      `<path class="thin" d="M30 110 H90 M90 110 V90 H150 M150 90 V70 H170"/>` + [118, 128, 138].map(y => `<line class="thin" x1="26" y1="${y}" x2="34" y2="${y + 4}"/>`).join('') +
      A('M6 132 L36 132') + A('M40 136 C90 132 120 110 160 32') + T(120, 172, 'seção que funciona como chaminé|a section that acts as a chimney', 'middle'),
    bakerCDS: () => {
      let s = `<path d="M30 150 V30 H210 V150"/><line x1="10" y1="150" x2="230" y2="150"/>`;
      for (let i = 0; i < 9; i++) for (let j = 0; j < 6; j++) { const x = 44 + i * 19, y = 44 + j * 18; s += `<path d="M${x} ${y - 6} L${x + 6} ${y} L${x} ${y + 6} L${x - 6} ${y} Z"/>`; }
      return s + A('M6 90 L234 90') + T(120, 172, 'jali de tijolo: luz, sombra e brisa|brick jali: light, shade and breeze', 'middle');
    }

  R3('torreVentos', 'his',
    ["Torre dos Ventos", "Um relógio do ar no centro de Atenas", "Torre octogonal de mármore na Ágora Romana. Cada face traz em relevo um dos oito ventos personificados, e no topo um cata-vento em forma de Tritão apontava qual deles soprava.", "Além do cata-vento, a torre tinha relógios de sol nas fachadas e um relógio de água no interior. Era um instrumento público para ler o tempo e o clima.", "Uma das primeiras arquiteturas dedicadas a tornar o vento visível e legível para a cidade.", "c. 50 a.C. · Andronikos de Kyrrhos"],
    ["Tower of the Winds", "An air clock in the heart of Athens", "An octagonal marble tower in the Roman Agora. Each face carries a relief of one of the eight personified winds, and on top a Triton-shaped vane pointed to whichever was blowing.", "Besides the vane, the tower had sundials on its faces and a water clock inside. It was a public instrument for reading time and weather.", "One of the first works of architecture devoted to making the wind visible and legible to the city.", "c. 50 BC · Andronikos of Kyrrhos"], ['vento']);
  R3('hipocausto', 'his',
    ["Hipocausto", "Aquecer um edifício com ar quente sob o piso", "Nos banhos e casas romanas, uma fornalha soltava ar quente e fumaça num vão sob o piso, apoiado em pilhas de tijolos. O ar subia depois por dutos nas paredes, aquecendo os ambientes por baixo e pelos lados.", "Plínio atribui a invenção a Sergius Orata. As termas tinham salas em sequência de temperatura, do frigidário ao caldário, organizadas pela distância da fornalha.", "O primeiro sistema de calefação por ar distribuído de que se tem registro: estrutura e climatização num só desenho.", "c. 80 a.C. · Sergius Orata (atribuído)"],
    ["Hypocaust", "Heating a building with hot air under the floor", "In Roman baths and houses, a furnace sent hot air and smoke into a void beneath the floor, raised on brick stacks. The air then rose through ducts in the walls, warming rooms from below and the sides.", "Pliny credits Sergius Orata with the invention. Baths arranged rooms in a sequence of temperatures, from frigidarium to caldarium, by their distance from the furnace.", "The earliest recorded system of distributed air heating: structure and climate control in a single design.", "c. 80 BC · Sergius Orata (attributed)"], ['conveccao', 'combustao']);
  R3('panteao', 'his',
    ["Panteão", "Uma cúpula aberta para o céu", "A maior cúpula de concreto não armado do mundo tem no topo um óculo aberto. Por ele entram luz e chuva, e sai o ar quente que sobe dentro do grande volume.", "A cúpula mede cerca de 43 m de diâmetro, a mesma medida da altura interna. O piso levemente inclinado e com drenos escoa a água que cai pelo óculo.", "Um único vazio funciona como janela, chaminé e relógio de luz: o volume interno inteiro respira por ele.", "c. 125 d.C. · Imperador Adriano"],
    ["Pantheon", "A dome open to the sky", "The world’s largest unreinforced concrete dome has an open oculus at its crown. Light and rain come in through it, and warm air rising in the great volume escapes.", "The dome spans about 43 m, the same as the interior height. The gently sloped floor with drains carries away water falling through the oculus.", "A single void acts as window, chimney and light clock: the whole interior volume breathes through it.", "c. 125 AD · Emperor Hadrian"], ['chamine', 'empuxo']);
  R3('malqafEgito', 'his',
    ["Malqaf faraônico", "Captadores de vento no Egito antigo", "Pinturas em tumbas de Tebas mostram casas com aberturas inclinadas no telhado, voltadas para o vento norte do Nilo. É a representação mais antiga conhecida de um captador de vento.", "O malqaf atravessou séculos de arquitetura egípcia e árabe. Hassan Fathy o retomou no século XX, em Nova Gourna, como dispositivo de baixo custo.", "Mostra que captar o vento no alto e levá-lo para dentro é uma das técnicas climáticas mais antigas da arquitetura.", "c. 1300 a.C. · Egito, Novo Império"],
    ["Pharaonic malqaf", "Windcatchers in ancient Egypt", "Paintings in Theban tombs show houses with slanted roof openings facing the Nile’s north wind. It is the oldest known depiction of a windcatcher.", "The malqaf ran through centuries of Egyptian and Arab architecture. Hassan Fathy revived it in the 20th century at New Gourna as a low-cost device.", "It shows that catching wind up high and bringing it inside is among architecture’s oldest climatic techniques.", "c. 1300 BC · Egypt, New Kingdom"], ['badgir', 'vento']);
  R3('tenda', 'his',
    ["Tenda beduína", "Uma casa de tecido que respira", "O tecido de pelo de cabra é tramado de forma aberta: no calor seco deixa o ar passar e filtra a luz; com chuva, as fibras incham e a trama se fecha. As laterais se abrem ou fecham conforme o vento.", "A tenda é leve, desmontável e ajustada ao deserto: sombra densa no alto, ventilação baixa e laterais que viram para o lado do vento.", "Uma envoltória que regula ar, luz e água sozinha, só pelo comportamento do material.", "Tradicional · povos beduínos"],
    ["Bedouin tent", "A fabric house that breathes", "Goat-hair cloth is loosely woven: in dry heat it lets air through and filters light; in rain the fibres swell and the weave closes. The sides open or close with the wind.", "The tent is light, portable and tuned to the desert: dense shade above, low ventilation and sides that turn toward the wind.", "An envelope that regulates air, light and water on its own, purely through the behaviour of its material.", "Traditional · Bedouin peoples"], ['higroscopia', 'cruzada']);
  R3('iglu', 'his',
    ["Iglu", "Neve e ar parado contra o frio", "Blocos de neve compacta formam uma cúpula cheia de bolsões de ar, que isolam muito bem. A entrada fica abaixo do piso de dormir, para que o ar frio se acumule ali e não suba.", "O calor do corpo e de uma lamparina mantém o interior dezenas de graus mais quente que o exterior. Uma pequena abertura no alto renova o ar.", "Um tratado de estratificação: o corte separa o ar frio, que desce, do ar morno, que fica no alto onde se dorme.", "Tradicional · povos inuit"],
    ["Igloo", "Snow and still air against the cold", "Blocks of packed snow form a dome full of air pockets, which insulate very well. The entrance sits below the sleeping platform so cold air collects there instead of rising.", "Body heat and a lamp keep the interior tens of degrees warmer than outside. A small opening at the top renews the air.", "A treatise on stratification: the section separates sinking cold air from warm air that stays up where people sleep.", "Traditional · Inuit peoples"], ['isolamento', 'empuxo']);
  R3('leonardo', 'his',
    ["Códice sobre o voo dos pássaros", "Desenhar o ar a partir das aves", "Leonardo da Vinci observou como as aves usam o vento e as correntes para voar e esboçou máquinas com asas articuladas. Os cadernos tratam o ar como um fluido com peso e resistência.", "Ele percebeu que o ar se comprime sob a asa e que a ave se apoia nele, ideias próximas da aerodinâmica moderna, séculos antes de ela existir.", "O desenho como instrumento para tornar o ar visível, uma ponte entre arte, ciência e projeto.", "c. 1505 · Leonardo da Vinci"],
    ["Codex on the Flight of Birds", "Drawing air through birds", "Leonardo da Vinci watched how birds use wind and currents to fly and sketched machines with articulated wings. The notebooks treat air as a fluid with weight and resistance.", "He saw that air compresses under the wing and that the bird rests on it, ideas close to modern aerodynamics centuries before it existed.", "Drawing as a tool for making air visible, a bridge between art, science and design.", "c. 1505 · Leonardo da Vinci"], ['voo', 'formacaoV']);
  R3('montgolfier', 'his',
    ["Balão Montgolfier", "O primeiro voo humano foi feito de ar quente", "Os irmãos Montgolfier encheram um grande envelope de papel e tecido com o ar de uma fogueira. Em novembro de 1783, em Paris, ele levou duas pessoas ao céu pela primeira vez.", "O voo tripulado foi feito por Pilâtre de Rozier e pelo marquês d’Arlandes. Os irmãos acreditavam inicialmente que a fumaça continha um gás especial; o efeito era só o ar mais leve.", "O empuxo do ar quente transformado em objeto, espetáculo e engenharia, origem de toda a arquitetura inflável.", "1783 · Joseph-Michel e Jacques-Étienne Montgolfier"],
    ["Montgolfier balloon", "The first human flight was made of hot air", "The Montgolfier brothers filled a large paper-and-cloth envelope with air from a fire. In November 1783, in Paris, it carried two people into the sky for the first time.", "The crewed flight was made by Pilâtre de Rozier and the Marquis d’Arlandes. The brothers first believed the smoke held a special gas; the effect was simply lighter air.", "Hot-air buoyancy turned into object, spectacle and engineering, the origin of all inflatable architecture.", "1783 · Joseph-Michel and Jacques-Étienne Montgolfier"], ['empuxo']);
  R3('hawaMahal', 'his',
    ["Hawa Mahal", "O Palácio dos Ventos", "A fachada de arenito rosa em Jaipur tem centenas de pequenas janelas com treliça. Elas deixavam as mulheres da corte ver a rua sem serem vistas e conduziam a brisa para dentro.", "A fachada tem cerca de cinco andares, mas pouca profundidade: funciona quase como uma tela. As pequenas aberturas aceleram o ar que passa por elas.", "Uma fachada inteira pensada como filtro de ar, olhar e luz, parente do muxarabi.", "1799 · Lal Chand Ustad"],
    ["Hawa Mahal", "The Palace of Winds", "The pink sandstone façade in Jaipur has hundreds of small latticed windows. They let the women of the court watch the street unseen and drew the breeze inside.", "The façade is about five storeys high but shallow: it works almost as a screen. The small openings speed up the air passing through them.", "A whole façade conceived as a filter for air, gaze and light, a relative of the mashrabiya.", "1799 · Lal Chand Ustad"], ['venturi', 'muxarabi']);
  R3('crystalPalace', 'his',
    ["Crystal Palace", "Ventilar um palácio de vidro", "O pavilhão da Grande Exposição de Londres foi montado com peças padronizadas de ferro e vidro. Para não superaquecer, tinha venezianas reguláveis junto ao chão e no alto, toldos de lona e árvores dentro.", "Joseph Paxton, jardineiro e construtor de estufas, levou a técnica das estufas à escala de um edifício público de mais de 500 m de comprimento.", "Mostra cedo o problema e a resposta de toda arquitetura de vidro: ventilar pelo efeito chaminé e sombrear por fora.", "1851 · Joseph Paxton"],
    ["Crystal Palace", "Ventilating a glass palace", "The pavilion for London’s Great Exhibition was assembled from standardised iron and glass parts. To avoid overheating it had adjustable louvres at floor level and up high, canvas awnings and trees inside.", "Joseph Paxton, gardener and greenhouse builder, took greenhouse technique to the scale of a public building more than 500 m long.", "It shows early the problem and the answer of all glass architecture: ventilate through the stack effect and shade from outside.", "1851 · Joseph Paxton"], ['chamine', 'conveccao']);

  R3('duchamp', 'arte',
    ["Air de Paris", "Um pouco de ar como obra de arte", "Marcel Duchamp pediu a um farmacêutico que esvaziasse uma ampola de vidro e a fechasse de novo, guardando o ar de Paris. Levou-a de presente a um colecionador em Nova York.", "É um ready-made: um objeto comum escolhido e nomeado pelo artista. A original quebrou e foi substituída por uma réplica com o ar de outro lugar.", "O ar, invisível e banal, passa a ser objeto de coleção e de memória de um lugar.", "1919 · Marcel Duchamp"],
    ["Air de Paris", "A little air as a work of art", "Marcel Duchamp asked a pharmacist to empty a glass ampoule and seal it again, keeping the air of Paris. He took it as a gift to a collector in New York.", "It is a readymade: an ordinary object chosen and named by the artist. The original broke and was replaced by a replica holding air from somewhere else.", "Air, invisible and ordinary, becomes a collected object and a memory of a place.", "1919 · Marcel Duchamp"], ['composicao']);
  R3('blueSail', 'arte',
    ["Blue Sail", "O vento de um ventilador tornado visível", "Um grande pano de chiffon azul fica preso por pesos nos cantos e um ventilador sopra por baixo. O tecido flutua, ondula e muda de forma sem parar.", "Como em outros sistemas de Hans Haacke, a obra é um processo: ela depende de correntes de ar que o artista não controla totalmente.", "Uma membrana leve desenha as correntes de ar de um ambiente, como um instrumento de medição poético.", "1964–1965 · Hans Haacke"],
    ["Blue Sail", "A fan’s wind made visible", "A large sheet of blue chiffon is held by weights at the corners while a fan blows from below. The fabric floats, ripples and changes shape continuously.", "Like Hans Haacke’s other systems, the work is a process: it depends on air currents the artist does not fully control.", "A light membrane traces the air currents in a room, like a poetic measuring instrument.", "1964–1965 · Hans Haacke"], ['vento', 'camadaLimite']);
  R3('christoPackage', 'arte',
    ["5.600 m³ Package", "Uma escultura de ar de 85 metros", "Christo e Jeanne-Claude ergueram em Kassel um envelope de tecido cheio de ar, amarrado por cordas, com cerca de 85 m de altura. Guindastes e cabos o mantinham de pé.", "Foi apresentado na documenta 4 e exigiu várias tentativas até ficar de pé. O ar era o único conteúdo do “pacote”.", "O ar ganha escala de edifício e presença de monumento, contido apenas por uma pele.", "1968 · Christo e Jeanne-Claude"],
    ["5,600 Cubicmeter Package", "An 85-metre sculpture of air", "In Kassel, Christo and Jeanne-Claude raised a fabric envelope filled with air and tied with ropes, about 85 m tall. Cranes and cables held it upright.", "It was shown at documenta 4 and took several attempts to raise. Air was the package’s only content.", "Air takes on the scale of a building and the presence of a monument, held only by a skin.", "1968 · Christo and Jeanne-Claude"], ['pneumatica', 'gases']);
  R3('olympicRainbow', 'arte',
    ["Olympic Rainbow", "Um arco-íris inflado sobre o estádio", "Otto Piene ergueu cinco tubos de polietileno cheios de hélio, nas cores olímpicas, que se arqueavam por centenas de metros no céu de Munique no encerramento dos Jogos.", "Piene, do grupo ZERO, criou a ideia de Sky Art: obras que usam o céu, o vento e a luz como suporte.", "O ar como meio para desenhar no céu urbano, em escala de paisagem.", "1972 · Otto Piene"],
    ["Olympic Rainbow", "An inflated rainbow over the stadium", "Otto Piene raised five helium-filled polyethylene tubes in the Olympic colours, arching hundreds of metres across the Munich sky at the closing of the Games.", "Piene, of the ZERO group, developed the idea of Sky Art: works that use sky, wind and light as their medium.", "Air as a medium for drawing in the urban sky, at landscape scale.", "1972 · Otto Piene"], ['empuxo']);
  R3('parreno', 'arte',
    ["Speech Bubbles", "Balões de fala que ficam no teto", "Philippe Parreno encheu com hélio centenas de balões em forma de balão de fala de história em quadrinhos. Eles se acumulam contra o teto, vazios de texto.", "Os balões foram criados para uma manifestação sindical, para que os participantes escrevessem neles suas reivindicações. Na galeria, ficam em branco.", "O ar que sobe vira suporte para a fala que não foi dita: uma sala ocupada por volumes leves.", "1997 · Philippe Parreno"],
    ["Speech Bubbles", "Speech balloons that gather on the ceiling", "Philippe Parreno filled hundreds of balloons shaped like comic-strip speech bubbles with helium. They gather against the ceiling, empty of text.", "The balloons were made for a trade-union demonstration, so participants could write their demands on them. In the gallery they stay blank.", "Rising air becomes a support for unspoken speech: a room occupied by light volumes.", "1997 · Philippe Parreno"], ['empuxo']);
  R3('leviathan', 'arte',
    ["Leviathan", "Um corpo inflado dentro de uma nave de vidro", "Anish Kapoor encheu a nave do Grand Palais com uma membrana de PVC inflada, com três grandes lóbulos e cerca de 35 m de altura. Por dentro, o visitante entra num espaço vermelho e translúcido.", "A obra foi feita para a série Monumenta. Por fora, ela empurra a arquitetura de ferro e vidro; por dentro, a luz atravessa a pele e tinge o ar.", "A arquitetura pneumática usada como escultura: o ar sob pressão cria um interior novo dentro de um interior existente.", "2011 · Anish Kapoor"],
    ["Leviathan", "An inflated body inside a glass nave", "Anish Kapoor filled the nave of the Grand Palais with an inflated PVC membrane of three great lobes, about 35 m high. Inside, visitors enter a red, translucent space.", "It was made for the Monumenta series. Outside, it presses against the iron-and-glass architecture; inside, light passes through the skin and colours the air.", "Pneumatic architecture used as sculpture: pressurised air creates a new interior inside an existing one.", "2011 · Anish Kapoor"], ['pneumatica']);
  R3('nimbus', 'arte',
    ["Nimbus", "Nuvens que duram segundos dentro de salas", "Berndnaut Smilde cria pequenas nuvens dentro de igrejas, museus e salões, controlando umidade, temperatura e luz, e as fotografa antes que se desfaçam.", "Cada nuvem existe por poucos segundos. A obra final é a fotografia, registro de um clima produzido e perdido no mesmo instante.", "O ar interior vira matéria escultórica: uma imagem precisa de condensação num lugar que não deveria tê-la.", "Desde 2010 · Berndnaut Smilde"],
    ["Nimbus", "Clouds lasting seconds inside rooms", "Berndnaut Smilde makes small clouds inside churches, museums and halls by controlling humidity, temperature and light, and photographs them before they dissolve.", "Each cloud exists for a few seconds. The final work is the photograph, a record of a climate produced and lost in the same instant.", "Indoor air becomes sculptural matter: a precise image of condensation in a place that should not have it.", "Since 2010 · Berndnaut Smilde"], ['nuvem', 'orvalho']);
  R3('janssens', 'arte',
    ["Yellowbluepink", "Salas de névoa colorida", "Ann Veronica Janssens enche salas de névoa e luz colorida. O visitante perde as bordas do espaço e vê as cores se misturarem conforme caminha.", "Ela trabalha a névoa há décadas, em instalações que tornam a percepção instável: o espaço parece infinito e o próprio corpo some na luz.", "O ar carregado de gotículas apaga as paredes: a arquitetura passa a ser feita só de luz e névoa.", "2015 · Ann Veronica Janssens"],
    ["Yellowbluepink", "Rooms of coloured mist", "Ann Veronica Janssens fills rooms with mist and coloured light. Visitors lose the edges of the space and see colours blend as they walk.", "She has worked with mist for decades, in installations that make perception unstable: space seems endless and one’s own body dissolves in light.", "Droplet-laden air erases the walls: architecture becomes made of light and mist alone.", "2015 · Ann Veronica Janssens"], ['nuvem', 'miragem']);

  R3('antFarm', 'exp',
    ["Clean Air Pod", "Uma bolha de ar limpo como protesto", "O coletivo Ant Farm inflou na Universidade da Califórnia em Berkeley uma bolha de plástico onde as pessoas podiam se abrigar do ar poluído, vestidas como em um laboratório.", "O grupo produziu estruturas infláveis baratas e um manual, o Inflatocookbook, para que qualquer um construísse a sua.", "A arquitetura inflável como crítica ambiental: o ar limpo como bem a proteger.", "1970 · Ant Farm"],
    ["Clean Air Pod", "A bubble of clean air as protest", "The Ant Farm collective inflated a plastic bubble at the University of California, Berkeley, where people could shelter from polluted air, dressed as if in a laboratory.", "The group produced cheap inflatable structures and a manual, the Inflatocookbook, so anyone could build their own.", "Inflatable architecture as environmental critique: clean air as a good to protect.", "1970 · Ant Farm"], ['pneumatica', 'composicao']);
  R3('cloudscapes', 'exp',
    ["Cloudscapes", "Atravessar uma nuvem por dentro", "Num pavilhão da Bienal de Arquitetura de Veneza, uma nuvem artificial pairava no meio do espaço. Uma rampa em espiral levava o visitante de baixo, fresco e seco, para cima, quente e úmido, atravessando a nuvem.", "O projeto foi feito com os engenheiros climáticos da Transsolar, que controlaram temperatura e umidade de cada camada de ar para que a nuvem se mantivesse estável.", "A estratificação do ar vira espaço arquitetônico: o percurso é uma travessia de climas.", "2010 · Tetsuo Kondo e Transsolar"],
    ["Cloudscapes", "Walking through a cloud", "In a pavilion at the Venice Architecture Biennale, an artificial cloud hovered in the middle of the space. A spiral ramp took visitors from the cool, dry bottom to the warm, humid top, through the cloud.", "It was made with the climate engineers of Transsolar, who controlled the temperature and humidity of each air layer to keep the cloud stable.", "Air stratification becomes architectural space: the route is a passage through climates.", "2010 · Tetsuo Kondo and Transsolar"], ['nuvem', 'orvalho']);

  R3('tubeHouse', 'arq',
    ["Tube House", "Uma casa cuja seção é uma chaminé", "Charles Correa desenhou em Ahmedabad uma casa estreita e longa com um corte inclinado: o ar entra pelas venezianas no nível da rua e sobe pelos pavimentos até uma abertura no alto.", "O projeto venceu um concurso de habitação de baixo custo. Sem ar-condicionado, a forma da seção cria a ventilação no clima quente e seco.", "Uma lição de que o corte, e não só a planta, pode ser o principal instrumento climático do projeto.", "1962 · Charles Correa"],
    ["Tube House", "A house whose section is a chimney", "In Ahmedabad, Charles Correa designed a long, narrow house with a sloping section: air enters through louvres at street level and rises through the floors to an opening at the top.", "It won a low-cost housing competition. Without air conditioning, the shape of the section creates ventilation in the hot, dry climate.", "A lesson that the section, not only the plan, can be a project’s main climatic tool.", "1962 · Charles Correa"], ['chamine', 'cruzada']);
  R3('bakerCDS', 'arq',
    ["Centro de Estudos do Desenvolvimento", "Paredes de tijolo vazado", "Laurie Baker construiu o campus em Trivandrum com tijolos assentados em treliça, os jalis, que deixam passar brisa e luz difusa e dispensam janelas de vidro em muitos espaços.", "Baker defendia construir com material local e pouco dinheiro. As paredes curvas e vazadas também economizam tijolos.", "A parede inteira funciona como filtro climático, numa versão indiana e artesanal do cobogó.", "1971–1975 · Laurie Baker"],
    ["Centre for Development Studies", "Walls of pierced brick", "Laurie Baker built the campus in Trivandrum with bricks laid as lattice screens, jalis, which let breeze and diffuse light through and do away with glass windows in many spaces.", "Baker argued for building with local materials and little money. The curved, pierced walls also save bricks.", "The whole wall works as a climatic filter, an Indian, handcrafted version of the cobogó.", "1971–1975 · Laurie Baker"], ['cobogo', 'cruzada']);
  R3('silves', 'arq',
    ["Pousada Ilha de Silves", "Uma grande cobertura ventilada na Amazônia", "Severiano Mário Porto desenhou a pousada com madeira regional e uma cobertura alta e ampla sobre espaços abertos, que sombreia e deixa o ar quente sair pelo alto.", "Porto construiu muito na Amazônia, adaptando técnicas locais ao clima quente e úmido, com estruturas leves e grande ventilação.", "No clima úmido, a ventilação constante é a principal estratégia: a cobertura vira o edifício.", "1983 · Severiano Mário Porto"],
    ["Ilha de Silves Lodge", "A great ventilated roof in the Amazon", "Severiano Mário Porto designed the lodge in regional timber with a high, broad roof over open spaces, which shades them and lets warm air out at the top.", "Porto built widely in the Amazon, adapting local techniques to the hot, humid climate with light structures and generous ventilation.", "In a humid climate, constant ventilation is the main strategy: the roof becomes the building.", "1983 · Severiano Mário Porto"], ['telhado', 'cruzada']);
  R3('latapie', 'arq',
    ["Casa Latapie", "Metade casa, metade estufa", "Lacaton & Vassal construíram uma casa barata em que metade é um volume fechado e metade uma estufa de policarbonato. A estufa aquece no inverno e se abre por inteiro no verão.", "Painéis e aberturas no teto da estufa deixam o ar quente sair nos dias quentes. O espaço a mais, quase sem custo, muda com as estações.", "Um espaço intermediário que usa o efeito estufa e a ventilação em vez de equipamentos.", "1993 · Lacaton & Vassal"],
    ["Latapie House", "Half house, half greenhouse", "Lacaton & Vassal built a low-cost house in which half is a closed volume and half a polycarbonate greenhouse. The greenhouse warms up in winter and opens fully in summer.", "Panels and roof openings in the greenhouse let warm air out on hot days. The extra space, at almost no cost, changes with the seasons.", "An intermediate space that uses the greenhouse effect and ventilation instead of equipment.", "1993 · Lacaton & Vassal"], ['conveccao', 'isolamento']);
  R3('gando', 'arq',

  const isSaved = k => items.some(i => i.k === k);

  function persist() {

        first = false;
        refreshSaved();

    } catch (e) {}
  }
